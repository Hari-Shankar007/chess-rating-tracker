<!DOCTYPE html>
<html lang="en">
<head>

  <title>Chess Rating Tracker - AI Training Plans</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);

    .container {
      max-width: 1200px;

      box-shadow: 0 20px 60px rgba(0,0,0,0.3);

    h1 { text-align: center; color: #1a1a2e; margin-bottom: 10px; font-size: 2.5em; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
    .input-section { background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 30px; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input[type="text"] {
      width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px;
      font-size: 16px; transition: border-color 0.3s;
    }
    input[type="text"]:focus { outline: none; border-color: #0f3460; }
    .btn-group { display: flex; gap: 15px; flex-wrap: wrap; }
    button {
      flex: 1; min-width: 150px; padding: 12px 25px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;
    }
    .btn-primary { background: #0f3460; color: white; }
    .btn-primary:hover { background: #16213e; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(15,52,96,0.3); }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #c82333; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    .players-list { margin-bottom: 30px; }
    .player-card {
      background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: all 0.3s; border: 2px solid transparent;
    }
    .player-card:hover { transform: translateX(5px); border-color: #0f3460; }
    .player-card.active { border-color: #0f3460; background: #e7f1ff; }
    .player-info h3 { color: #333; margin-bottom: 5px; }
    .player-info p { color: #666; font-size: 14px; }
    .player-actions button { min-width: auto; padding: 8px 15px; font-size: 14px; }
    .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 30px; margin-top: 30px; }
    .chart-box { background: #f8f9fa; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .chart-box h3 { text-align: center; color: #333; margin-bottom: 15px; }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }
    @media (max-width: 768px) {
      .charts-container { grid-template-columns: 1fr; }
      .btn-group { flex-direction: column; }
    }

    /* Modal Styles */
    .report-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; padding: 20px;
    }
    .report-modal.active { display: flex; justify-content: center; align-items: flex-start; }
    .report-content {
      background: white; border-radius: 20px; padding: 40px; max-width: 1100px;
      width: 100%; margin: 20px; position: relative;
    }
    .report-close {
      position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer;
      color: #666; background: none; border: none; padding: 0; width: 40px; height: 40px;
    }
    .report-close:hover { color: #dc3545; }
    .report-header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid #0f3460; padding-bottom: 20px; }
    .report-header h2 { color: #0f3460; font-size: 2em; margin-bottom: 10px; }
    .auto-badge {
      display: inline-block; background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; margin-top: 10px;
    }
    .analysis-section { margin: 30px 0; }
    .analysis-section h3 {
      color: #333; margin-bottom: 20px; font-size: 1.4em;
      border-bottom: 2px solid #0f3460; padding-bottom: 10px;
    }
    .weakness-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 20px 0; }
    .weakness-card {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
      padding: 20px; border-radius: 12px; border-left: 5px solid #ffc107;
    }
    .weakness-card.critical {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      border-left-color: #dc3545;
    }
    .weakness-card.moderate {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
      border-left-color: #ffc107;
    }
    .weakness-card.weak {
      background: linear-gradient(135deg, #e2e3e5 0%, #d6d8db 100%);
      border-left-color: #6c757d;
    }
    .weakness-card h4 { color: #333; margin-bottom: 8px; font-size: 1.1em; }
    .weakness-card .accuracy { font-size: 2em; font-weight: bold; color: #dc3545; }
    .weakness-card .label { color: #666; font-size: 0.9em; margin-top: 5px; }
    .strength-card {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      padding: 20px; border-radius: 12px; border-left: 5px solid #28a745;
    }
    .strength-card .accuracy { color: #28a745; }
    .daily-tasks { margin: 30px 0; }
    .daily-tasks h3 { color: #333; margin-bottom: 20px; font-size: 1.4em; }
    .task-item {
      background: #f8f9fa; padding: 20px; margin: 15px 0; border-radius: 12px;
      border-left: 4px solid #0f3460; transition: all 0.3s;
    }
    .task-item:hover { transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .task-item.completed { opacity: 0.6; border-left-color: #28a745; background: #d4edda; }
    .task-header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .task-checkbox { width: 24px; height: 24px; cursor: pointer; }
    .task-title { font-size: 1.1em; font-weight: 600; color: #333; flex: 1; }
    .task-priority { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
    .task-priority.high { background: #dc3545; color: white; }
    .task-priority.medium { background: #ffc107; color: #333; }
    .task-priority.low { background: #6c757d; color: white; }
    .task-details { margin-left: 39px; color: #666; margin-top: 10px; }
    .task-reason {
      background: #e7f1ff; padding: 10px; border-radius: 8px;
      margin: 10px 0 10px 39px; font-size: 0.9em; color: #0f3460;
    }
    .task-progress { margin-left: 39px; margin-top: 10px; }
    .progress-bar {
      height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; margin-top: 5px;
    }
    .progress-fill { height: 100%; background: #28a745; transition: width 0.3s; }
    .task-link {
      display: inline-block; margin-top: 10px; padding: 8px 16px;
      background: #0f3460; color: white; border-radius: 8px; text-decoration: none; font-size: 0.9em;
    }
    .task-link:hover { background: #16213e; }
    .weekly-goals {
      background: #e8e8e8; padding: 25px; border-radius: 15px; margin: 30px 0; border: 2px solid #0f3460;
    }
    .weekly-goals h3 { color: #333; margin-bottom: 20px; }
    .goal-item {
      padding: 15px; background: #f8f9fa; border-radius: 8px; margin: 10px 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .goal-progress { font-weight: bold; color: #0f3460; }
    .goal-achieved { background: #d4edda !important; border-left: 4px solid #28a745; }
    .opening-stats { margin: 20px 0; }
    .opening-item {
      background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0;
      display: grid; grid-template-columns: 1fr auto auto; gap: 15px; align-items: center;
    }
    .opening-name { font-weight: 600; color: #333; }
    .opening-games { color: #666; }
    .opening-winrate {
      padding: 5px 12px; border-radius: 20px; font-weight: 600;
      min-width: 80px; text-align: center;
    }
    .opening-winrate.good { background: #d4edda; color: #155724; }
    .opening-winrate.bad { background: #f8d7da; color: #721c24; }
    .opening-winrate.neutral { background: #fff3cd; color: #856404; }
    .loading-spinner {
      display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3;
      border-top: 3px solid #0f3460; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .sync-status { background: #f0f8ff; padding: 15px; border-radius: 10px; margin: 20px 0; text-align: center; }
    .persist-badge {
      display: inline-block; background: #28a745; color: white; padding: 4px 8px;
      border-radius: 4px; font-size: 0.75em; margin-left: 8px;
    }

<body>
  <div class="container">
    <h1>Chess Rating Tracker</h1>
    <p class="subtitle">AI-powered training plans based on your actual weaknesses <span class="persist-badge">Data Saved</span></p>

    <div id="statusMessage"></div>

    <div class="input-section">
      <div class="input-group">
        <label for="playerName">Student Name</label>
        <input type="text" id="playerName" placeholder="e.g., Anand - Batch B2">
      </div>
      <div class="input-group">
        <label for="lichessUsername">Lichess Username (required for AI analysis)</label>
        <input type="text" id="lichessUsername" placeholder="e.g., anand_2009">
      </div>
      <div class="btn-group">
        <button class="btn-primary" onclick="addPlayer()">Add Student</button>
        <button class="btn-success" onclick="syncAllPlayers()">Sync All Players</button>
        <button class="btn-danger" onclick="clearAllData()">Clear All Data</button>
      </div>
    </div>

    <div class="players-list" id="playersList"></div>
    <div class="charts-container" id="chartsContainer"></div>
  </div>

  <!-- Report Modal -->
  <div class="report-modal" id="reportModal">
    <div class="report-content">
      <button class="report-close" onclick="closeReport()">&times;</button>
      <div id="reportBody"></div>
    </div>
  </div>

  <script>
    // Supabase client - configured for your project
    const SUPABASE_URL = 'https://vqpycvuqzgsynxxivkhj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxcHljdnVxemdzeW54eGl2a2hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzkxNTYsImV4cCI6MjA5Njc1NTE1Nn0.XNmHo_dX-h2XilT1mTpaZHfuasXux4OjvhLiK_lG97M';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Proxy for Lichess API (avoids CORS)
    async function fetchLichess(endpoint) {
      const proxyUrl = `${SUPABASE_URL}/functions/v1/lichess-proxy?path=${encodeURIComponent(endpoint)}`;
      console.log('Fetching:', proxyUrl);
      const response = await fetch(proxyUrl);
      const text = await response.text();
      console.log('Response:', text.substring(0, 200));
      if (!response.ok) {
        let errorMsg = 'Lichess API error';
        try { const err = JSON.parse(text); errorMsg = err.error || errorMsg; } catch {}
        throw new Error(errorMsg);
      }
      try { return JSON.parse(text); } catch { return text; }
    }

    const THEME_DISPLAY_NAMES = {
      "pin": "Pins", "fork": "Forks", "skewer": "Skewers",
      "discoveredAttack": "Discovered Attacks", "doubleAttack": "Double Attacks",
      "backRankMate": "Back Rank Mates", "mateIn1": "Mate in 1", "mateIn2": "Mate in 2", "mateIn3": "Mate in 3+",
      "queenRookEndgame": "Queen + Rook Endgames", "rookEndgame": "Rook Endgames",
      "pawnEndgame": "Pawn Endgames", "knightEndgame": "Knight Endgames", "bishopEndgame": "Bishop Endgames",
      "attraction": "Attraction", "deflection": "Deflection", "clearance": "Clearance",
      "interference": "Interference", "lineOpening": "Line Opening", "trappedPiece": "Trapped Pieces",
      "exchange": "Exchanges", "capturingDefender": "Capturing the Defender",
      "zugzwang": "Zugzwang", "promotion": "Pawn Promotion"
    };

    const THEME_LINKS = {
      "pin": "https://lichess.org/training/themes/pin",
      "fork": "https://lichess.org/training/themes/fork",
      "skewer": "https://lichess.org/training/themes/skewer",
      "discoveredAttack": "https://lichess.org/training/themes/discoveredAttack",
      "backRankMate": "https://lichess.org/training/themes/backRankMate",
      "rookEndgame": "https://lichess.org/practice/rook-endgames",
      "pawnEndgame": "https://lichess.org/practice/pawn-endgames",
    };

    let players = [];
    let selectedPlayerId = null;

    function showStatus(message, type = 'info') {
      const statusEl = document.getElementById('statusMessage');
      statusEl.className = `status ${type}`;
      statusEl.innerHTML = message;
    }

    async function loadPlayers() {
      try {
        const { data, error } = await supabase
          .from('players')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        players = data || [];
        displayPlayers();
      } catch (error) {
        console.error('Error loading players:', error);
        showStatus('Error loading players: ' + error.message, 'error');
      }
    }

    async function addPlayer() {
      const name = document.getElementById('playerName').value.trim();
      const lichessUsername = document.getElementById('lichessUsername').value.trim();

      if (!name) { showStatus('Please enter a student name', 'error'); return; }
      if (!lichessUsername) { showStatus('Lichess username required', 'error'); return; }

      showStatus('<span class="loading-spinner"></span>Adding student...', 'info');

      try {
        // Fetch rating from Lichess via proxy
        let userData;
        try {
          userData = await fetchLichess(`/api/user/${lichessUsername}`);
        } catch (e) {
          throw new Error('Lichess user not found: ' + lichessUsername);
        }

        if (!userData || userData.error) {
          throw new Error(userData?.error || 'Invalid Lichess user');
        }

        const rapidRating = userData.perfs?.rapid?.rating || null;
        const puzzleRating = userData.perfs?.puzzle?.rating || null;

        // Insert player
        const { data: newPlayer, error: insertError } = await supabase
          .from('players')
          .insert({ name, lichess_username: lichessUsername })
          .select()
          .single();

        if (insertError) throw insertError;

        // Store initial rating
        await supabase.from('rating_history').insert({
          player_id: newPlayer.id,
          lichess_rapid: rapidRating,
          lichess_puzzle: puzzleRating
        });

        document.getElementById('playerName').value = '';
        document.getElementById('lichessUsername').value = '';

        showStatus(`${name} added! Rating: ${rapidRating || 'N/A'}`, 'success');
        await loadPlayers();

        // Auto sync puzzle data
        syncTrainingPlan(newPlayer.id, name, lichessUsername).catch(e => console.error('Sync error:', e));
      } catch (error) {
        showStatus('Error: ' + error.message, 'error');
      }
    }

    async function fetchPlayerRating(playerId) {
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus('<span class="loading-spinner"></span>Fetching ratings...', 'info');

      try {
        const userData = await fetchLichess(`/api/user/${player.lichess_username}`);

        await supabase.from('rating_history').insert({
          player_id: playerId,
          lichess_rapid: userData.perfs?.rapid?.rating,
          lichess_puzzle: userData.perfs?.puzzle?.rating
        });

        showStatus(`Ratings updated for ${player.name}!`, 'success');
        await loadPlayers();
        if (selectedPlayerId === playerId) displayCharts(playerId);
      } catch (error) {
        showStatus('Error: ' + error.message, 'error');
      }
    }

    async function syncTrainingPlan(playerId, name, username) {
      const player = players.find(p => p.id === playerId);
      const displayName = name || player?.name;
      const lichessUser = username || player?.lichess_username;

      showStatus(`<span class="loading-spinner"></span>Analyzing ${displayName}'s games...`, 'info');

      try {
        // Fetch puzzle activity
        let puzzles = [];
        try {
          const puzzleText = await fetchLichess(`/api/puzzle/activity?max=100`);
          puzzles = puzzleText.split('\n').filter(l => l.trim()).map(l => {
            try { return JSON.parse(l); } catch { return null; }
          }).filter(p => p);
        } catch (e) { console.log('Puzzle activity fetch failed:', e); }

        // Fetch games
        let games = [];
        try {
          const gamesText = await fetchLichess(`/api/games/user/${lichessUser}?max=30&tags=true&opening=true`);
          games = gamesText.split('\n\n').filter(g => g.trim()).map(game => {
            const result = {};
            game.split('\n').forEach(line => {
              if (line.startsWith('[')) {
                const match = line.match(/\[([^\s]+)\s+"([^"]+)"\]/);
                if (match) result[match[1]] = match[2];
              }
            });
            return result;
          }).filter(g => g.Opening);
        } catch (e) { console.log('Games fetch failed:', e); }

        // Analyze puzzle themes
        const themeStats = {};
        puzzles.forEach(p => {
          if (!p.puzzle?.themes) return;
          const correct = p.win === true;
          p.puzzle.themes.forEach(theme => {
            if (!themeStats[theme]) themeStats[theme] = { total: 0, correct: 0 };
            themeStats[theme].total++;
            if (correct) themeStats[theme].correct++;
          });
        });

        // Store puzzle performance
        for (const [theme, stats] of Object.entries(themeStats)) {
          const accuracy = stats.total > 0 ? (stats.correct / stats.total) * 100 : 0;
          await supabase.from('puzzle_performance').upsert({
            player_id: playerId,
            theme,
            total: stats.total,
            correct: stats.correct,
            accuracy
          }, { onConflict: 'player_id,theme' });
        }

        // Analyze openings
        const openingStats = {};
        games.forEach(g => {
          const opening = g.Opening?.split(':')[0]?.trim();
          if (!opening) return;
          if (!openingStats[opening]) openingStats[opening] = { played: 0, won: 0, drawn: 0, lost: 0 };
          openingStats[opening].played++;
          if (g.Result === '1-0') openingStats[opening].won++;
          else if (g.Result === '0-1') openingStats[opening].lost++;
          else openingStats[opening].drawn++;
        });

        // Store opening stats
        for (const [name, stats] of Object.entries(openingStats)) {
          const winRate = stats.played > 0 ? ((stats.won + stats.drawn * 0.5) / stats.played) * 100 : 0;
          await supabase.from('opening_stats').upsert({
            player_id: playerId,
            opening_name: name,
            games_played: stats.played,
            games_won: stats.won,
            games_drawn: stats.drawn,
            games_lost: stats.lost,
            win_rate: winRate
          }, { onConflict: 'player_id,opening_name' });
        }

        // Update player sync time
        await supabase.from('players').update({
          last_auto_update: new Date().toISOString(),
          training_plan: {
            lastGenerated: new Date().toISOString(),
            puzzlesAnalyzed: puzzles.length,
            themesCount: Object.keys(themeStats).length
          }
        }).eq('id', playerId);

        // Generate training tasks based on weaknesses
        await generateTasks(playerId, themeStats);

        showStatus(`${displayName}: ${puzzles.length} puzzles, ${Object.keys(themeStats).length} themes!`, 'success');
        await loadPlayers();
      } catch (error) {
        showStatus('Error syncing: ' + error.message, 'error');
      }
    }

    async function generateTasks(playerId, themeStats) {
      // Identify weaknesses
      const weaknesses = Object.entries(themeStats)
        .map(([theme, stats]) => ({
          theme,
          accuracy: stats.total > 0 ? (stats.correct / stats.total) * 100 : 0,
          total: stats.total,
          correct: stats.correct
        }))
        .filter(w => w.total >= 3 && w.accuracy < 75)
        .sort((a, b) => a.accuracy - b.accuracy);

      // Clear old tasks
      await supabase.from('training_tasks')
        .delete()
        .eq('player_id', playerId);

      // Create tasks for top weaknesses
      const today = new Date().toISOString().split('T')[0];
      const tasks = [];

      for (let i = 0; i < Math.min(3, weaknesses.length); i++) {
        const w = weaknesses[i];
        const count = w.accuracy < 50 ? 25 : w.accuracy < 65 ? 20 : 15;
        const strength = w.accuracy < 50 ? 'critical' : w.accuracy < 65 ? 'moderate' : 'weak';

        tasks.push({
          player_id: playerId,
          date: today,
          task_type: 'puzzle',
          task_title: `Solve ${count} "${THEME_DISPLAY_NAMES[w.theme] || w.theme}" puzzles`,
          task_details: `Target: 80% accuracy | Current: ${w.accuracy.toFixed(0)}%`,
          weakness_reason: `WEAKNESS: ${w.accuracy.toFixed(0)}% accuracy (${w.correct}/${w.total}) - ${strength.toUpperCase()}`,
          link: THEME_LINKS[w.theme] || 'https://lichess.org/training',
          priority: strength === 'critical' ? 'high' : 'medium',
          theme: w.theme,
          target_count: count,
          current_count: 0,
          completed: false
        });
      }

      // Add game practice task
      tasks.push({
        player_id: playerId,
        date: today,
        task_type: 'game',
        task_title: 'Play 1-2 rapid games (15+10)',
        task_details: 'Apply tactical patterns in real games',
        weakness_reason: 'PRACTICE: Apply your training',
        link: 'https://lichess.org',
        priority: 'high',
        completed: false
      });

      for (const task of tasks) {
        await supabase.from('training_tasks').insert(task);
      }

      // Generate weekly goals
      const weekStart = new Date();
      weekStart.setDate(weekStart.getDate() - weekStart.getDay());
      const weekStartStr = weekStart.toISOString().split('T')[0];

      const goals = [
        { player_id: playerId, week_start: weekStartStr, goal_type: 'puzzle_count', goal_text: 'Complete 100+ puzzles', target_value: 100, current_value: 0 },
        { player_id: playerId, week_start: weekStartStr, goal_type: 'accuracy', goal_text: 'Achieve 70%+ accuracy', target_value: 70, current_value: 0 }
      ];

      if (weaknesses.length > 0) {
        goals.push({
          player_id: playerId,
          week_start: weekStartStr,
          goal_type: 'weakness',
          goal_text: `Improve ${THEME_DISPLAY_NAMES[weaknesses[0].theme]} to 75%+`,
          target_value: 75,
          current_value: Math.round(weaknesses[0].accuracy)
        });
      }

      for (const goal of goals) {
        await supabase.from('weekly_goals').upsert(goal, { onConflict: 'player_id,week_start,goal_type' });
      }
    }

    async function syncAllPlayers() {
      if (players.length === 0) { showStatus('No students to sync', 'error'); return; }

      for (const player of players) {
        await syncTrainingPlan(player.id, player.name, player.lichess_username);
        await new Promise(r => setTimeout(r, 500));
      }
      showStatus('All players synced!', 'success');
    }

    async function showTrainingReport(playerId) {
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus('<span class="loading-spinner"></span>Loading...', 'info');

      try {
        const today = new Date().toISOString().split('T')[0];

        const [tasksRes, goalsRes, puzzleRes, openingsRes] = await Promise.all([
          supabase.from('training_tasks').select('*').eq('player_id', playerId).eq('date', today),
          supabase.from('weekly_goals').select('*').eq('player_id', playerId),
          supabase.from('puzzle_performance').select('*').eq('player_id', playerId).order('accuracy'),
          supabase.from('opening_stats').select('*').eq('player_id', playerId).order('games_played', { ascending: false })
        ]);

        const weaknesses = (puzzleRes.data || [])
          .filter(p => p.accuracy < 75 && p.total >= 3)
          .map(p => ({
            theme: p.theme,
            accuracy: p.accuracy,
            total: p.total,
            correct: p.correct,
            strength: p.accuracy < 50 ? 'critical' : p.accuracy < 65 ? 'moderate' : 'weak'
          }));

        const strengths = (puzzleRes.data || [])
          .filter(p => p.accuracy >= 80 && p.total >= 3)
          .map(p => ({ theme: p.theme, accuracy: p.accuracy, total: p.total }));

        const html = generateReportHTML(player, {
          tasks: tasksRes.data || [],
          goals: goalsRes.data || [],
          weaknesses,
          strengths,
          openings: openingsRes.data || [],
          rating: player.training_plan?.rating
        });

        document.getElementById('reportBody').innerHTML = html;
        document.getElementById('reportModal').classList.add('active');
        showStatus('', 'info');
      } catch (error) {
        showStatus('Error: ' + error.message, 'error');
      }
    }

    function generateReportHTML(player, data) {
      return `
        <div class="report-header">
          <h2>AI Training Plan</h2>
          <h3>${player.name}</h3>
          <span class="auto-badge">Rating: ${data.rating || 'N/A'}</span>
        </div>

        ${data.weaknesses.length > 0 ? `
          <div class="analysis-section">
            <h3>🚨 WEAKNESSES (Tasks target these areas)</h3>
            <div class="weakness-grid">
              ${data.weaknesses.slice(0, 4).map(w => `
                <div class="weakness-card ${w.strength}">
                  <h4>${THEME_DISPLAY_NAMES[w.theme] || w.theme}</h4>
                  <div class="accuracy">${w.accuracy.toFixed(0)}%</div>
                  <div class="label">${w.correct}/${w.total} correct</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : `
          <div class="analysis-section">
            <h3>✅ No Weaknesses Detected</h3>
            <p style="color:#666;">Sync puzzles to analyze or you're performing well!</p>
          </div>
        `}

        ${data.strengths.length > 0 ? `
          <div class="analysis-section">
            <h3>💪 STRENGTHS</h3>
            <div class="weakness-grid">
              ${data.strengths.map(s => `
                <div class="strength-card">
                  <h4>${THEME_DISPLAY_NAMES[s.theme] || s.theme}</h4>
                  <div class="accuracy">${s.accuracy.toFixed(0)}%</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${data.openings.length > 0 ? `
          <div class="analysis-section">
            <h3>📖 OPENINGS</h3>
            ${data.openings.slice(0, 5).map(o => `
              <div class="opening-item">
                <div class="opening-name">${o.opening_name}</div>
                <div class="opening-games">${o.games_played} g</div>
                <div class="opening-winrate ${o.win_rate >= 50 ? 'good' : o.win_rate >= 40 ? 'neutral' : 'bad'}">${o.win_rate.toFixed(0)}%</div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <div class="analysis-section">
          <h3>🎯 TODAY'S TASKS</h3>
          ${data.tasks.length > 0 ? data.tasks.map(t => `
            <div class="task-item ${t.completed ? 'completed' : ''}">
              <div class="task-header">
                <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${player.id}', '${t.id}', this.checked)">
                <span class="task-title">${t.task_title}</span>
                <span class="task-priority ${t.priority}">${t.priority?.toUpperCase() || 'MED'}</span>
              </div>
              <div class="task-details">${t.task_details || ''}</div>
              ${t.weakness_reason ? `<div class="task-reason">${t.weakness_reason}</div>` : ''}
              ${t.link ? `<a href="${t.link}" target="_blank" class="task-link">Start →</a>` : ''}
            </div>
          `).join('') : '<p style="color:#666;">No tasks. Sync puzzles to generate.</p>'}
        </div>

        <div class="analysis-section">
          <h3>📈 WEEKLY GOALS</h3>
          <div class="weekly-goals">
            ${data.goals.map(g => `
              <div class="goal-item ${g.achieved ? 'goal-achieved' : ''}">
                <span>${g.goal_text} ${g.achieved ? '✅' : ''}</span>
                <span class="goal-progress">${g.current_value || 0}/${g.target_value}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="sync-status">
          <strong>Last sync:</strong> ${player.last_auto_update ? new Date(player.last_auto_update).toLocaleString() : 'Never'}
        </div>
      `;
    }

    async function toggleTask(playerId, taskId, checked) {
      await supabase.from('training_tasks')
        .update({ completed: checked, completed_at: checked ? new Date().toISOString() : null })
        .eq('id', taskId);
    }

    async function deletePlayer(playerId) {
      if (!confirm('Delete this student?')) return;

      await supabase.from('players').delete().eq('id', playerId);
      showStatus('Deleted', 'success');
      await loadPlayers();
      if (selectedPlayerId === playerId) {
        selectedPlayerId = null;
        document.getElementById('chartsContainer').innerHTML = '';
      }
    }

    async function clearAllData() {
      if (!confirm('Delete ALL data?')) return;
      for (const p of players) {
        await supabase.from('players').delete().eq('id', p.id);
      }
      showStatus('Cleared', 'success');
      await loadPlayers();
    }

    function displayPlayers() {
      const container = document.getElementById('playersList');

      if (players.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#666;">No students yet. Add one above!</p>';
        return;
      }

      container.innerHTML = players.map(player => `
        <div class="player-card ${selectedPlayerId === player.id ? 'active' : ''}"
             onclick="selectPlayer('${player.id}')">
          <div class="player-info">
            <h3>${player.name}</h3>
            <p>Lichess: ${player.lichess_username} | Rating: ${player.training_plan?.rating || 'N/A'}</p>
            ${player.last_auto_update ? `<small style="color:#888">Synced: ${new Date(player.last_auto_update).toLocaleDateString()}</small>` : ''}
          </div>
          <div class="player-actions">
            <button class="btn-secondary" onclick="event.stopPropagation(); fetchPlayerRating('${player.id}')">Rating</button>
            <button class="btn-success" onclick="event.stopPropagation(); syncTrainingPlan('${player.id}')">Sync</button>
            <button class="btn-primary" onclick="event.stopPropagation(); showTrainingReport('${player.id}')">Plan</button>
            <button class="btn-danger" onclick="event.stopPropagation(); deletePlayer('${player.id}')">X</button>
          </div>
        </div>
      `).join('');
    }

    function selectPlayer(playerId) {
      selectedPlayerId = playerId;
      displayPlayers();
      displayCharts(playerId);
    }

    async function displayCharts(playerId) {
      const { data: history } = await supabase
        .from('rating_history')
        .select('*')
        .eq('player_id', playerId)
        .order('timestamp', { ascending: true });

      if (!history || history.length === 0) {
        document.getElementById('chartsContainer').innerHTML = '<p style="text-align:center;color:#666;">No history. Click "Rating" to fetch.</p>';
        return;
      }

      const labels = history.map(h => new Date(h.timestamp).toLocaleDateString());
      const rapidData = history.map(h => h.lichess_rapid);
      const puzzleData = history.map(h => h.lichess_puzzle);

      document.getElementById('chartsContainer').innerHTML = `
        <div class="chart-box"><h3>Rapid Rating</h3><canvas id="rapidChart"></canvas></div>
        <div class="chart-box"><h3>Puzzle Rating</h3><canvas id="puzzleChart"></canvas></div>
      `;

      setTimeout(() => {
        createChart('rapidChart', labels, rapidData, 'Rapid', '#0f3460');
        createChart('puzzleChart', labels, puzzleData, 'Puzzle', '#dc3545');
      }, 100);
    }

    function createChart(id, labels, data, label, color) {
      const ctx = document.getElementById(id);
      if (!ctx) return;
      new Chart(ctx, {
        type: 'line',
        data: { labels, datasets: [{ label, data, borderColor: color, backgroundColor: color + '22', fill: true, tension: 0.4 }] },
        options: { responsive: true, scales: { y: { beginAtZero: false } } }
      });
    }

    function closeReport() {
      document.getElementById('reportModal').classList.remove('active');
    }

    document.getElementById('reportModal').addEventListener('click', e => {
      if (e.target === document.getElementById('reportModal')) closeReport();
    });

    // Initialize
    loadPlayers();
  </script>
</body>
</html>
