<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Rating Tracker - AI Training Plans</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
    }
    h1 { text-align: center; color: #1a1a2e; margin-bottom: 10px; font-size: 2.5em; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1em; }
    .input-section { background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 30px; }
    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input[type="text"] {
      width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px;
      font-size: 16px; transition: border-color 0.3s;
    }
    input[type="text"]:focus { outline: none; border-color: #0f3460; }
    .btn-group { display: flex; gap: 15px; flex-wrap: wrap; }
    button {
      flex: 1; min-width: 150px; padding: 12px 25px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;
    }
    .btn-primary { background: #0f3460; color: white; }
    .btn-primary:hover { background: #16213e; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(15,52,96,0.3); }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #c82333; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #218838; }
    .players-list { margin-bottom: 30px; }
    .player-card {
      background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: all 0.3s; border: 2px solid transparent;
    }
    .player-card:hover { transform: translateX(5px); border-color: #0f3460; }
    .player-card.active { border-color: #0f3460; background: #e7f1ff; }
    .player-info h3 { color: #333; margin-bottom: 5px; }
    .player-info p { color: #666; font-size: 14px; }
    .player-actions button { min-width: auto; padding: 8px 15px; font-size: 14px; }
    .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 30px; margin-top: 30px; }
    .chart-box { background: #f8f9fa; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .chart-box h3 { text-align: center; color: #333; margin-bottom: 15px; }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }
    @media (max-width: 768px) {
      .charts-container { grid-template-columns: 1fr; }
      .btn-group { flex-direction: column; }
    }

    /* Modal Styles */
    .report-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; padding: 20px;
    }
    .report-modal.active { display: flex; justify-content: center; align-items: flex-start; }
    .report-content {
      background: white; border-radius: 20px; padding: 40px; max-width: 1100px;
      width: 100%; margin: 20px; position: relative;
    }
    .report-close {
      position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer;
      color: #666; background: none; border: none; padding: 0; width: 40px; height: 40px;
    }
    .report-close:hover { color: #dc3545; }
    .report-header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid #0f3460; padding-bottom: 20px; }
    .report-header h2 { color: #0f3460; font-size: 2em; margin-bottom: 10px; }
    .auto-badge {
      display: inline-block; background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9em; margin-top: 10px;
    }
    .analysis-section { margin: 30px 0; }
    .analysis-section h3 {
      color: #333; margin-bottom: 20px; font-size: 1.4em;
      border-bottom: 2px solid #0f3460; padding-bottom: 10px;
    }
    .weakness-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 20px 0; }
    .weakness-card {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
      padding: 20px; border-radius: 12px; border-left: 5px solid #ffc107;
    }
    .weakness-card.critical {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      border-left-color: #dc3545;
    }
    .weakness-card.moderate {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
      border-left-color: #ffc107;
    }
    .weakness-card.weak {
      background: linear-gradient(135deg, #e2e3e5 0%, #d6d8db 100%);
      border-left-color: #6c757d;
    }
    .weakness-card h4 { color: #333; margin-bottom: 8px; font-size: 1.1em; }
    .weakness-card .accuracy { font-size: 2em; font-weight: bold; color: #dc3545; }
    .weakness-card .label { color: #666; font-size: 0.9em; margin-top: 5px; }
    .strength-card {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      padding: 20px; border-radius: 12px; border-left: 5px solid #28a745;
    }
    .strength-card .accuracy { color: #28a745; }
    .daily-tasks { margin: 30px 0; }
    .daily-tasks h3 { color: #333; margin-bottom: 20px; font-size: 1.4em; }
    .task-item {
      background: #f8f9fa; padding: 20px; margin: 15px 0; border-radius: 12px;
      border-left: 4px solid #0f3460; transition: all 0.3s;
    }
    .task-item:hover { transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .task-item.completed { opacity: 0.6; border-left-color: #28a745; background: #d4edda; }
    .task-header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .task-checkbox { width: 24px; height: 24px; cursor: pointer; }
    .task-title { font-size: 1.1em; font-weight: 600; color: #333; flex: 1; }
    .task-priority { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
    .task-priority.high { background: #dc3545; color: white; }
    .task-priority.medium { background: #ffc107; color: #333; }
    .task-priority.low { background: #6c757d; color: white; }
    .task-details { margin-left: 39px; color: #666; margin-top: 10px; }
    .task-reason {
      background: #e7f1ff; padding: 10px; border-radius: 8px;
      margin: 10px 0 10px 39px; font-size: 0.9em; color: #0f3460;
    }
    .task-progress { margin-left: 39px; margin-top: 10px; }
    .progress-bar {
      height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; margin-top: 5px;
    }
    .progress-fill { height: 100%; background: #28a745; transition: width 0.3s; }
    .task-link {
      display: inline-block; margin-top: 10px; padding: 8px 16px;
      background: #0f3460; color: white; border-radius: 8px; text-decoration: none; font-size: 0.9em;
    }
    .task-link:hover { background: #16213e; }
    .weekly-goals {
      background: #e8e8e8; padding: 25px; border-radius: 15px; margin: 30px 0; border: 2px solid #0f3460;
    }
    .weekly-goals h3 { color: #333; margin-bottom: 20px; }
    .goal-item {
      padding: 15px; background: #f8f9fa; border-radius: 8px; margin: 10px 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .goal-progress { font-weight: bold; color: #0f3460; }
    .goal-achieved { background: #d4edda !important; border-left: 4px solid #28a745; }
    .opening-stats { margin: 20px 0; }
    .opening-item {
      background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0;
      display: grid; grid-template-columns: 1fr auto auto; gap: 15px; align-items: center;
    }
    .opening-name { font-weight: 600; color: #333; }
    .opening-games { color: #666; }
    .opening-winrate {
      padding: 5px 12px; border-radius: 20px; font-weight: 600;
      min-width: 80px; text-align: center;
    }
    .opening-winrate.good { background: #d4edda; color: #155724; }
    .opening-winrate.bad { background: #f8d7da; color: #721c24; }
    .opening-winrate.neutral { background: #fff3cd; color: #856404; }
    .loading-spinner {
      display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3;
      border-top: 3px solid #0f3460; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
    .metric-card {
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      color: white; padding: 25px; border-radius: 15px; text-align: center;
    }
    .metric-card h4 { font-size: 14px; margin-bottom: 10px; opacity: 0.9; }
    .metric-card .big-number { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
    .metric-card .change { font-size: 1.1em; display: inline-block; padding: 5px 12px; border-radius: 20px; background: rgba(255,255,255,0.2); }
    .sync-status { background: #f0f8ff; padding: 15px; border-radius: 10px; margin: 20px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chess Rating Tracker</h1>
    <p class="subtitle">AI-powered training plans based on your actual weaknesses</p>

    <div id="statusMessage"></div>

    <div class="input-section">
      <div class="input-group">
        <label for="playerName">Student Name</label>
        <input type="text" id="playerName" placeholder="e.g., Anand - Batch B2">
      </div>
      <div class="input-group">
        <label for="lichessUsername">Lichess Username (required for AI analysis)</label>
        <input type="text" id="lichessUsername" placeholder="e.g., anand_2009">
      </div>
      <div class="btn-group">
        <button class="btn-primary" onclick="addPlayer()">Add Student</button>
        <button class="btn-success" onclick="fetchAllTrainingPlans()">Sync All Training Plans</button>
        <button class="btn-danger" onclick="clearAllData()">Clear All Data</button>
      </div>
    </div>

    <div class="players-list" id="playersList"></div>
    <div class="charts-container" id="chartsContainer"></div>
  </div>

  <!-- Report Modal -->
  <div class="report-modal" id="reportModal">
    <div class="report-content">
      <button class="report-close" onclick="closeReport()">&times;</button>
      <div id="reportBody"></div>
    </div>
  </div>

  <script>
    const SUPABASE_EDGE = '/functions/v1/auto-training';

    const THEME_DISPLAY_NAMES = {
      "pin": "Pins", "fork": "Forks", "skewer": "Skewers",
      "discoveredAttack": "Discovered Attacks", "doubleAttack": "Double Attacks",
      "backRankMate": "Back Rank Mates", "mateIn1": "Mate in 1", "mateIn2": "Mate in 2", "mateIn3": "Mate in 3+",
      "queenRookEndgame": "Queen + Rook Endgames", "rookEndgame": "Rook Endgames",
      "pawnEndgame": "Pawn Endgames", "knightEndgame": "Knight Endgames", "bishopEndgame": "Bishop Endgames",
      "attraction": "Attraction", "deflection": "Deflection", "clearance": "Clearance",
      "interference": "Interference", "lineOpening": "Line Opening", "trappedPiece": "Trapped Pieces",
      "exchange": "Exchanges", "capturingDefender": "Capturing the Defender",
      "zugzwang": "Zugzwang", "promotion": "Pawn Promotion"
    };

    const THEME_LINKS = {
      "pin": "https://lichess.org/training/themes/pin",
      "fork": "https://lichess.org/training/themes/fork",
      "skewer": "https://lichess.org/training/themes/skewer",
      "discoveredAttack": "https://lichess.org/training/themes/discoveredAttack",
      "backRankMate": "https://lichess.org/training/themes/backRankMate",
      "rookEndgame": "https://lichess.org/practice/rook-endgames",
      "pawnEndgame": "https://lichess.org/practice/pawn-endgames",
    };

    const LOCAL_KEY = 'chessTrackerLocal';
    let selectedPlayerId = null;

    function getLocalPlayers() {
      const data = localStorage.getItem(LOCAL_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveLocalPlayers(players) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(players));
    }

    function showStatus(message, type = 'info') {
      const statusEl = document.getElementById('statusMessage');
      statusEl.className = `status ${type}`;
      statusEl.innerHTML = message;
    }

    async function callEdgeFunction(action, method = 'GET', body = null, extraParams = '') {
      const url = `${SUPABASE_EDGE}?action=${action}${extraParams}`;
      const options = {
        method,
        headers: { 'Content-Type': 'application/json' }
      };
      if (body) options.body = JSON.stringify(body);
      const response = await fetch(url, options);
      return response.json();
    }

    async function addPlayer() {
      const name = document.getElementById('playerName').value.trim();
      const lichessUsername = document.getElementById('lichessUsername').value.trim();

      if (!name) { showStatus('Please enter a student name', 'error'); return; }
      if (!lichessUsername) { showStatus('Lichess username required for AI training', 'error'); return; }

      showStatus('<span class="loading-spinner"></span>Adding student...', 'info');

      const players = getLocalPlayers();
      const newPlayer = {
        id: Date.now().toString(),
        name,
        lichessUsername,
        history: []
      };
      players.push(newPlayer);
      saveLocalPlayers(players);

      await fetchPlayerRating(newPlayer.id);
      document.getElementById('playerName').value = '';
      document.getElementById('lichessUsername').value = '';
      displayPlayers();
    }

    async function fetchPlayerRating(playerId) {
      const players = getLocalPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus(`<span class="loading-spinner"></span>Fetching ratings...`, 'info');

      try {
        const response = await fetch(`https://lichess.org/api/user/${player.lichessUsername}`);
        if (!response.ok) throw new Error('User not found');
        const data = await response.json();

        const snapshot = {
          timestamp: Date.now(),
          rapid: data.perfs?.rapid?.rating || null,
          puzzle: data.perfs?.puzzle?.rating || null
        };

        const playerIdx = players.findIndex(p => p.id === playerId);
        players[playerIdx].history.push(snapshot);
        players[playerIdx].currentRating = snapshot.rapid;
        players[playerIdx].puzzleRating = snapshot.puzzle;
        saveLocalPlayers(players);

        showStatus(`Ratings updated for ${player.name}!`, 'success');
        displayPlayers();
        if (selectedPlayerId === playerId) displayCharts(playerId);
      } catch (error) {
        showStatus(`Error fetching ratings: ${error.message}`, 'error');
      }
    }

    async function syncTrainingPlan(playerId) {
      const players = getLocalPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus('<span class="loading-spinner"></span>Analyzing puzzles and games from Lichess...', 'info');

      try {
        const result = await callEdgeFunction('sync_and_plan', 'POST', {
          playerId,
          lichessUsername: player.lichessUsername
        });

        player.lastSync = new Date().toISOString();
        player.puzzlesAnalyzed = result.puzzlesAnalyzed || 0;
        player.themesCount = result.themesCount || 0;
        saveLocalPlayers(players);

        showStatus(`Analyzed ${result.puzzlesAnalyzed} puzzles, ${result.themesCount} themes! Training plan updated.`, 'success');
        displayPlayers();
      } catch (error) {
        showStatus(`Error syncing: ${error.message}`, 'error');
      }
    }

    async function fetchAllTrainingPlans() {
      const players = getLocalPlayers();
      if (players.length === 0) { showStatus('No students added', 'error'); return; }

      for (const player of players) {
        await syncTrainingPlan(player.id);
        await new Promise(r => setTimeout(r, 1000));
      }
      showStatus('All training plans synced!', 'success');
    }

    async function showTrainingReport(playerId) {
      const players = getLocalPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus('<span class="loading-spinner"></span>Loading training data...', 'info');

      try {
        const response = await fetch(`${SUPABASE_EDGE}?playerId=${playerId}`);
        const data = await response.json();

        const html = generateReportHTML(player, data);
        document.getElementById('reportBody').innerHTML = html;
        document.getElementById('reportModal').classList.add('active');
        showStatus('', 'info');
      } catch (error) {
        showStatus(`Error loading report: ${error.message}`, 'error');
      }
    }

    function generateReportHTML(player, data) {
      const weaknesses = data.weaknesses || [];
      const strengths = data.strengths || [];
      const tasks = data.tasks || [];
      const goals = data.goals || [];
      const openings = data.openings || [];
      const puzzlePerf = data.puzzlePerformance || [];

      return `
        <div class="report-header">
          <h2>AI Training Plan</h2>
          <h3>${player.name}</h3>
          <span class="auto-badge">Based on ${data.recentAttempts?.length || 0} recent puzzle attempts</span>
        </div>

        ${weaknesses.length > 0 ? `
          <div class="analysis-section">
            <h3>🚨 YOUR WEAKNESSES (Areas needing improvement)</h3>
            <div class="weakness-grid">
              ${weaknesses.slice(0, 4).map(w => `
                <div class="weakness-card ${w.strength}">
                  <h4>${THEME_DISPLAY_NAMES[w.theme] || w.theme}</h4>
                  <div class="accuracy">${w.accuracy.toFixed(0)}%</div>
                  <div class="label">${w.correct}/${w.total} correct | ${w.strength.toUpperCase()}</div>
                </div>
              `).join('')}
            </div>
            <p style="color: #666; margin-top: 15px;">Tasks below are designed to fix these weaknesses.</p>
          </div>
        ` : `
          <div class="analysis-section">
            <h3>✅ No Weaknesses Found</h3>
            <p style="color: #666;">Complete more themed puzzles on Lichess for detailed weakness analysis, or you're performing well across all areas!</p>
          </div>
        `}

        ${strengths.length > 0 ? `
          <div class="analysis-section">
            <h3>💪 YOUR STRENGTHS</h3>
            <div class="weakness-grid">
              ${strengths.slice(0, 3).map(s => `
                <div class="strength-card">
                  <h4>${THEME_DISPLAY_NAMES[s.theme] || s.theme}</h4>
                  <div class="accuracy">${s.accuracy.toFixed(0)}%</div>
                  <div class="label">${s.total} puzzles solved</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${openings.length > 0 ? `
          <div class="analysis-section">
            <h3>📖 OPENING PERFORMANCE</h3>
            <div class="opening-stats">
              ${openings.slice(0, 6).map(o => `
                <div class="opening-item">
                  <div class="opening-name">${o.opening_name}</div>
                  <div class="opening-games">${o.games_played} games</div>
                  <div class="opening-winrate ${o.win_rate >= 50 ? 'good' : o.win_rate >= 40 ? 'neutral' : 'bad'}">
                    ${o.win_rate.toFixed(0)}% win
                  </div>
                </div>
              `).join('')}
            </div>
            <p style="color: #666; margin-top: 10px; font-size: 0.9em;">
              ${openings.find(o => o.win_rate < 40 && o.games_played >= 3) ?
                '⚠️ Consider studying alternatives to openings with low win rates.' :
                '✅ Your opening repertoire is performing well!'}
            </p>
          </div>
        ` : ''}

        <div class="analysis-section">
          <h3>🎯 TODAY'S TRAINING TASKS</h3>
          <p style="color: #666; margin-bottom: 15px;">Each task targets a detected weakness.</p>
          <div class="daily-tasks">
            ${tasks.map((task, idx) => `
              <div class="task-item ${task.completed ? 'completed' : ''}" id="task-${idx}">
                <div class="task-header">
                  <input type="checkbox" class="task-checkbox"
                         ${task.completed ? 'checked' : ''}
                         onchange="toggleTask('${player.id}', '${task.id}')">
                  <div class="task-title">${task.task_title}</div>
                  <span class="task-priority ${task.priority}">${task.priority.toUpperCase()}</span>
                </div>
                <div class="task-details">${task.task_details}</div>
                <div class="task-reason">${task.weakness_reason}</div>
                ${task.target_count > 0 ? `
                  <div class="task-progress">
                    <small>Progress: ${task.current_count || 0}/${task.target_count}</small>
                    <div class="progress-bar">
                      <div class="progress-fill" style="width: ${((task.current_count || 0) / task.target_count) * 100}%"></div>
                    </div>
                  </div>
                ` : ''}
                ${task.link ? `<a href="${task.link}" target="_blank" class="task-link">Start Training →</a>` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        <div class="analysis-section">
          <h3>📈 WEEKLY GOALS</h3>
          <div class="weekly-goals">
            ${goals.map(goal => `
              <div class="goal-item ${goal.achieved ? 'goal-achieved' : ''}">
                <span>${goal.goal_text} ${goal.achieved ? '✅' : ''}</span>
                <span class="goal-progress">${goal.current_value || 0} / ${goal.target_value || '?'}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="sync-status">
          <strong>Last synced:</strong> ${player.lastSync ? new Date(player.lastSync).toLocaleString() : 'Never'}
          <br><small style="color: #666;">Click "Sync" to fetch latest puzzle data from Lichess</small>
        </div>
      `;
    }

    async function toggleTask(playerId, taskId) {
      await callEdgeFunction('complete_task', 'POST', { taskId });
      // Refresh the report
      showTrainingReport(playerId);
    }

    function displayPlayers() {
      const players = getLocalPlayers();
      const container = document.getElementById('playersList');

      if (players.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#666;">No students added yet. Add your first student above!</p>';
        return;
      }

      container.innerHTML = players.map(player => {
        const lastSnapshot = player.history[player.history.length - 1];
        return `
          <div class="player-card ${selectedPlayerId === player.id ? 'active' : ''}" onclick="selectPlayer('${player.id}')">
            <div class="player-info">
              <h3>${player.name}</h3>
              <p>Lichess: ${player.lichessUsername} | Rating: ${player.currentRating || 'N/A'} | ${player.history.length} snapshots</p>
              ${player.lastSync ? `<small style="color: #888;">Last sync: ${new Date(player.lastSync).toLocaleDateString()}</small>` : ''}
            </div>
            <div class="player-actions">
              <button class="btn-secondary" onclick="event.stopPropagation(); fetchPlayerRating('${player.id}')">Update Rating</button>
              <button class="btn-success" onclick="event.stopPropagation(); syncTrainingPlan('${player.id}')">Sync Puzzles</button>
              <button class="btn-primary" onclick="event.stopPropagation(); showTrainingReport('${player.id}')">AI Training Plan</button>
              <button class="btn-danger" onclick="event.stopPropagation(); deletePlayer('${player.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectPlayer(playerId) {
      selectedPlayerId = playerId;
      displayPlayers();
      displayCharts(playerId);
    }

    function displayCharts(playerId) {
      const players = getLocalPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player || player.history.length === 0) {
        document.getElementById('chartsContainer').innerHTML = '<p style="text-align:center;color:#666;">No rating history yet.</p>';
        return;
      }

      const labels = player.history.map(h => new Date(h.timestamp).toLocaleDateString());
      const rapidData = player.history.map(h => h.rapid);
      const puzzleData = player.history.map(h => h.puzzle);

      const container = document.getElementById('chartsContainer');
      container.innerHTML = `
        <div class="chart-box">
          <h3>Rapid Rating</h3>
          <canvas id="rapidChart"></canvas>
        </div>
        <div class="chart-box">
          <h3>Puzzle Rating</h3>
          <canvas id="puzzleChart"></canvas>
        </div>
      `;

      setTimeout(() => {
        createChart('rapidChart', labels, rapidData, 'Rapid', '#0f3460');
        createChart('puzzleChart', labels, puzzleData, 'Puzzle', '#dc3545');
      }, 100);
    }

    function createChart(canvasId, labels, data, label, color) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label,
            data,
            borderColor: color,
            backgroundColor: color + '33',
            borderWidth: 3,
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: false } }
        }
      });
    }

    function deletePlayer(playerId) {
      if (!confirm('Delete this student?')) return;
      let players = getLocalPlayers().filter(p => p.id !== playerId);
      saveLocalPlayers(players);
      if (selectedPlayerId === playerId) {
        selectedPlayerId = null;
        document.getElementById('chartsContainer').innerHTML = '';
      }
      displayPlayers();
      showStatus('Student deleted', 'success');
    }

    function clearAllData() {
      if (!confirm('Delete ALL data?')) return;
      localStorage.removeItem(LOCAL_KEY);
      selectedPlayerId = null;
      displayPlayers();
      document.getElementById('chartsContainer').innerHTML = '';
      showStatus('All data cleared', 'success');
    }

    function closeReport() {
      document.getElementById('reportModal').classList.remove('active');
    }

    document.getElementById('reportModal').addEventListener('click', function(e) {
      if (e.target === this) closeReport();
    });

    // Initialize
    displayPlayers();
  </script>
</body>
</html>
