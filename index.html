<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Rating Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    .input-section {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 150px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102,126,234,0.3);
    }
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background: #5a6268;
    }
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    .btn-danger:hover {
      background: #c82333;
    }
    .players-list {
      margin-bottom: 30px;
    }
    .player-card {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }
    .player-card:hover {
      transform: translateX(5px);
      border-color: #667eea;
    }
    .player-card.active {
      border-color: #667eea;
      background: #e7f1ff;
    }
    .player-info h3 {
      color: #333;
      margin-bottom: 5px;
    }
    .player-info p {
      color: #666;
      font-size: 14px;
    }
    .player-actions button {
      min-width: auto;
      padding: 8px 15px;
      font-size: 14px;
    }
    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }
    .chart-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .chart-box h3 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
    }
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }
    @media (max-width: 768px) {
      .charts-container {
        grid-template-columns: 1fr;
      }
      .btn-group {
        flex-direction: column;
      }
    }
        /* Report Modal Styles */
    .report-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    .report-modal.active {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .report-content {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 900px;
      width: 100%;
      margin: 20px;
      position: relative;
    }
    .report-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 30px;
      cursor: pointer;
      color: #666;
      background: none;
      border: none;
      padding: 0;
      width: 40px;
      height: 40px;
    }
    .report-close:hover {
      color: #dc3545;
    }
    .report-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .report-header h2 {
      color: #667eea;
      font-size: 2em;
      margin-bottom: 10px;
    }
    .report-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .metric-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }
    .metric-card h4 {
      font-size: 14px;
      margin-bottom: 10px;
      opacity: 0.9;
    }
    .metric-card .big-number {
      font-size: 2.5em;
      font-weight: bold;
      margin: 10px 0;
    }
    .metric-card .change {
      font-size: 1.1em;
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
    }
    .metric-card .change.positive {
      background: rgba(76,175,80,0.3);
    }
    .metric-card .change.negative {
      background: rgba(244,67,54,0.3);
    }
    .achievements {
      margin: 30px 0;
      padding: 25px;
      background: #f8f9fa;
      border-radius: 15px;
    }
    .achievements h3 {
      color: #333;
      margin-bottom: 15px;
    }
    .badge {
      display: inline-block;
      padding: 8px 16px;
      margin: 5px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
    .badge.gold {
      background: #ffd700;
      color: #333;
    }
    .badge.silver {
      background: #c0c0c0;
      color: #333;
    }
    .badge.bronze {
      background: #cd7f32;
      color: white;
    }
    .badge.milestone {
      background: #667eea;
      color: white;
    }
    .recommendations {
      margin: 30px 0;
      padding: 25px;
      background: #e7f1ff;
      border-radius: 15px;
      border-left: 5px solid #667eea;
    }
    .recommendations h3 {
      color: #333;
      margin-bottom: 15px;
    }
    .recommendations ul {
      list-style: none;
      padding: 0;
    }
    .recommendations li {
      padding: 10px 0;
      color: #555;
      font-size: 1.05em;
    }
    .recommendations li:before {
      content: "✓ ";
      color: #667eea;
      font-weight: bold;
      margin-right: 10px;
    }
    .btn-report {
      background: #667eea;
      color: white;
      min-width: auto;
    }
    .print-btn {
      display: block;
      width: 100%;
      margin-top: 30px;
      padding: 15px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .print-btn:hover {
      background: #5568d3;
    }
        /* Training Plan Modal Styles */
    .training-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      overflow-y: auto;
      padding: 20px;
    }
    .training-modal.active {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .training-content {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 1000px;
      width: 100%;
      margin: 20px;
      position: relative;
    }
    .training-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 30px;
      cursor: pointer;
      color: #666;
      background: none;
      border: none;
    }
    .training-close:hover { color: #dc3545; }
    .plan-header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 3px solid #667eea;
      padding-bottom: 20px;
    }
    .plan-header h2 {
      color: #667eea;
      font-size: 2.2em;
      margin-bottom: 5px;
    }
    .plan-header .last-updated {
      color: #999;
      font-size: 0.9em;
    }
    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .analysis-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }
    .analysis-card h4 {
      color: #333;
      margin-bottom: 10px;
      font-size: 1.1em;
    }
    .analysis-card .value {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
      margin: 10px 0;
    }
    .analysis-card .label {
      color: #666;
      font-size: 0.9em;
    }
    .weakness-section {
      background: #fff3cd;
      padding: 25px;
      border-radius: 15px;
      border-left: 5px solid #ffc107;
      margin: 20px 0;
    }
    .weakness-section h3 {
      color: #856404;
      margin-bottom: 15px;
    }
    .weakness-list {
      list-style: none;
      padding: 0;
    }
    .weakness-list li {
      padding: 10px;
      margin: 5px 0;
      background: white;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .daily-tasks {
      margin: 30px 0;
    }
    .daily-tasks h3 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5em;
    }
    .task-item {
      background: #f8f9fa;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      border-left: 4px solid #667eea;
      transition: all 0.3s;
    }
    .task-item:hover {
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .task-item.completed {
      opacity: 0.6;
      border-left-color: #28a745;
    }
    .task-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }
    .task-checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }
    .task-title {
      font-size: 1.2em;
      font-weight: 600;
      color: #333;
      flex: 1;
    }
    .task-priority {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
    }
    .task-priority.high {
      background: #dc3545;
      color: white;
    }
    .task-priority.medium {
      background: #ffc107;
      color: #333;
    }
    .task-priority.low {
      background: #6c757d;
      color: white;
    }
    .task-details {
      margin-left: 39px;
      color: #666;
      margin-top: 10px;
    }
    .task-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: #667eea;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9em;
    }
    .task-link:hover {
      background: #5568d3;
    }
    .weekly-goals {
      background: #e7f1ff;
      padding: 25px;
      border-radius: 15px;
      margin: 30px 0;
    }
    .weekly-goals h3 {
      color: #333;
      margin-bottom: 20px;
    }
    .goal-item {
      padding: 15px;
      background: white;
      border-radius: 8px;
      margin: 10px 0;
    }
    .progress-tracker {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }
    .streak-display {
      text-align: center;
      font-size: 2em;
      color: #667eea;
      margin: 10px 0;
    }
    .btn-training {
      background: #28a745;
      color: white;
      min-width: auto;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      .report-content, .report-content * {
        visibility: visible;
      }
      .report-content {
        position: absolute;
        left: 0;
        top: 0;
      }
      .report-close, .print-btn {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>♟️ Chess Rating Tracker</h1>
    <p class="subtitle">Track puzzle and rapid ratings from Lichess & Chess.com</p>
    
    <div id="statusMessage"></div>
    
    <div class="input-section">
      <div class="input-group">
        <label for="playerName">Student Name</label>
        <input type="text" id="playerName" placeholder="e.g., Anand - Batch B2">
      </div>
      <div class="input-group">
        <label for="lichessUsername">Lichess Username (optional)</label>
        <input type="text" id="lichessUsername" placeholder="e.g., anand_2009">
      </div>
      <div class="input-group">
        <label for="chesscomUsername">Chess.com Username (optional)</label>
        <input type="text" id="chesscomUsername" placeholder="e.g., anand_chess2009">
      </div>
      <div class="btn-group">
        <button class="btn-primary" onclick="addPlayer()">➕ Add Student</button>
        <button class="btn-secondary" onclick="fetchAllRatings()">🔄 Update All Ratings</button>
        <button class="500
          " onclick="clearAllData()">🗑️ Clear All Data</button>
      </div>
    </div>
    
    <div class="players-list" id="playersList"></div>
    
    <div class="charts-container" id="chartsContainer"></div>
  </div>

    <!-- Report Modal -->
  <div class="report-modal" id="reportModal">
    <div class="report-content" id="reportContent">
      <button class="report-close" onclick="closeReport()">&times;</button>
      <div id="reportBody"></div>

        <!-- Training Plan Modal -->
  <div class="training-modal" id="trainingModal">
    <div class="training-content">
      <button class="training-close" onclick="closeTrainingPlan()">&times;</button>
      <div id="trainingBody"></div>
    </div>
  </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'chessRatingTracker';
    let selectedPlayerId = null;

    function getPlayers() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function savePlayers(players) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
    }

    function showStatus(message, type = 'info') {
      const statusEl = document.getElementById('statusMessage');
      statusEl.className = `status ${type}`;
      statusEl.textContent = message;
      setTimeout(() => statusEl.textContent = '', 5000);
    }

    async function fetchLichessRatings(username) {
      try {
        const response = await fetch(`https://lichess.org/api/user/${username}`);
        if (!response.ok) throw new Error('Lichess user not found');
        const data = await response.json();
        return {
          rapid: data.perfs?.rapid?.rating || null,
          puzzle: data.perfs?.puzzle?.rating || null
        };
      } catch (error) {
        console.error('Lichess error:', error);
        return { rapid: null, puzzle: null };
      }
    }

    async function fetchChesscomRatings(username) {
      try {
        const response = await fetch(`https://api.chess.com/pub/player/${username}/stats`);
        if (!response.ok) throw new Error('Chess.com user not found');
        const data = await response.json();
        return {
          rapid: data.chess_rapid?.last?.rating || null,
          puzzle: data.tactics?.highest?.rating || null
        };
      } catch (error) {
        console.error('Chess.com error:', error);
        return { rapid: null, puzzle: null };
      }
    }

    // ==========================================
      // ENHANCED API FUNCTIONS (Option B - Full AI)
      // ==========================================

      // Fetch Lichess puzzle activity with themes
      async function fetchLichessPuzzleActivity(username) {
        try {
          const response = await fetch(`https://lichess.org/api/puzzle/activity?max=50`);
          if (!response.ok) return null;
          const data = await response.json();
          return data;
        } catch (error) {
          console.error('Lichess puzzle activity error:', error);
          return null;
        }
      }

      // Fetch Lichess game statistics
      async function fetchLichessGameStats(username) {
        try {
          const response = await fetch(`https://lichess.org/api/user/${username}`);
          if (!response.ok) return null;
          const data = await response.json();
          return {
            perfs: data.perfs,
            playTime: data.playTime,
            count: data.count
          };
        } catch (error) {
          console.error('Lichess game stats error:', error);
          return null;
        }
      }

      // Fetch recent games for analysis
      async function fetchLichessRecentGames(username, max = 10) {
        try {
          const response = await fetch(`https://lichess.org/api/games/user/${username}?max=${max}&pgnInJson=false&tags=false&clocks=false&evals=false&opening=true`);
          if (!response.ok) return null;
          
          const text = await response.text();
          const games = text.trim().split('\n\n').filter(g => g.trim());
          
          return games.map(game => {
            const lines = game.split('\n');
            const result = {};
            lines.forEach(line => {
              if (line.startsWith('[')) {
                const match = line.match(/\[([^\s]+)\s+"([^"]+)"\]/);
                if (match) result[match[1]] = match[2];
              }
            });
            return result;
          });
        } catch (error) {
          console.error('Lichess recent games error:', error);
          return null;
        }
      }

    async function addPlayer() {
      const name = document.getElementById('playerName').value.trim();
      const lichessUser = document.getElementById('lichessUsername').value.trim();
      const chesscomUser = document.getElementById('chesscomUsername').value.trim();

      if (!name) {
        showStatus('Please enter a student name', 'error');
        return;
      }

      if (!lichessUser && !chesscomUser) {
        showStatus('Please enter at least one username (Lichess or Chess.com)', 'error');
        return;
      }

      const players = getPlayers();
      const newPlayer = {
        id: Date.now(),
        name,
        lichessUsername: lichessUser || null,
        chesscomUsername: chesscomUser || null,
        history: []
      };

      players.push(newPlayer);
      savePlayers(players);

      document.getElementById('playerName').value = '';
      document.getElementById('lichessUsername').value = '';
      document.getElementById('chesscomUsername').value = '';

      showStatus(`${name} added successfully!`, 'success');
      displayPlayers();
      await fetchPlayerRating(newPlayer.id);
    }

    async function fetchPlayerRating(playerId) {
      const players = getPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus(`Fetching ratings for ${player.name}...`, 'info');

      const snapshot = {
        timestamp: Date.now(),
        lichess: { rapid: null, puzzle: null },
        chesscom: { rapid: null, puzzle: null }
      };

      if (player.lichessUsername) {
        snapshot.lichess = await fetchLichessRatings(player.lichessUsername);
      }

      if (player.chesscomUsername) {
        snapshot.chesscom = await fetchChesscomRatings(player.chesscomUsername);
      }

      player.history.push(snapshot);
      savePlayers(players);

      showStatus(`Ratings updated for ${player.name}!`, 'success');
      displayPlayers();
      if (selectedPlayerId === playerId) {
        displayCharts(playerId);
      }
    }

    async function fetchAllRatings() {
      const players = getPlayers();
      if (players.length === 0) {
        showStatus('No students added yet', 'error');
        return;
      }

      showStatus('Updating all ratings...', 'info');
      for (const player of players) {
        await fetchPlayerRating(player.id);
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      showStatus('All ratings updated!', 'success');
    }

    function deletePlayer(playerId) {
      if (!confirm('Are you sure you want to delete this student?')) return;
      
      let players = getPlayers();
      players = players.filter(p => p.id !== playerId);
      savePlayers(players);
      
      if (selectedPlayerId === playerId) {
        selectedPlayerId = null;
        document.getElementById('chartsContainer').innerHTML = '';
      }
      
      showStatus('Student deleted', 'success');
      displayPlayers();
    }

    function displayPlayers() {
      const players = getPlayers();
      const container = document.getElementById('playersList');
      
      if (players.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#666;">No students added yet. Add your first student above!</p>';
        return;
      }

      container.innerHTML = players.map(player => {
        const lastSnapshot = player.history[player.history.length - 1];
        const platforms = [];
        if (player.lichessUsername) platforms.push('Lichess');
        if (player.chesscomUsername) platforms.push('Chess.com');
        
        return `
          <div class="player-card ${selectedPlayerId === player.id ? 'active' : ''}" onclick="selectPlayer(${player.id})">
            <div class="player-info">
              <h3>${player.name}</h3>
              <p>${platforms.join(' & ')} | ${player.history.length} snapshots</p>
            </div>
            <div class="player-actions">
              <button class="btn-primary" onclick="event.stopPropagation(); fetchPlayerRating(${player.id})">Update</button>
                            
                                          <button class="btn-training" onclick="event.stopPropagation(); showTrainingPlan(${player.id})">📚 Training</button> onclick="event.stopPropagation(); showReport(${player.id})">📊 Report</button>
              <button class="btn-danger" onclick="event.stopPropagation(); deletePlayer(${player.id})">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectPlayer(playerId) {
      selectedPlayerId = playerId;
      displayPlayers();
      displayCharts(playerId);
    }

    function displayCharts(playerId) {
      const players = getPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player || player.history.length === 0) {

    function shouldAutoUpdate(player) {

      if (!lastUpdate) return true;
      
      const daysSinceUpdate = (Date.now() - lastUpdate.timestamp) / (1000 * 60 * 60 * 24);
      return daysSinceUpdate >= 1; // Update if last update was 1+ days ago
    }

        // Report Generation Functions
    function generatePuzzleReport(player) {
      const history = player.history;
      if (history.length < 2) return null;
      
      const puzzleRatings = history.map(h => ({
        rating: h.lichess.puzzle || h.chesscom.puzzle,
        date: new Date(h.timestamp),
        platform: h.lichess.puzzle ? 'Lichess' : 'Chess.com'
      })).filter(r => r.rating !== null);
      
      if (puzzleRatings.length < 2) return null;
      
      const current = puzzleRatings[puzzleRatings.length - 1].rating;
      const starting = puzzleRatings[0].rating;
      const peak = Math.max(...puzzleRatings.map(r => r.rating));
      const totalChange = current - starting;
      const percentChange = ((totalChange / starting) * 100).toFixed(1);
      
      const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
      const recentRatings = puzzleRatings.filter(r => r.date.getTime() > oneWeekAgo);
      const weeklyChange = recentRatings.length >= 2 
        ? recentRatings[recentRatings.length - 1].rating - recentRatings[0].rating 
        : 0;
      
      const daysSinceStart = (Date.now() - puzzleRatings[0].date.getTime()) / (1000 * 60 * 60 * 24);
      const weeks = Math.max(daysSinceStart / 7, 1);
      const avgWeekly = Math.round(totalChange / weeks);
      
      let status = '📊 Steady';
      let badge = 'silver';
      if (avgWeekly >= 50) { status = '⭐ Excellent'; badge = 'gold'; }
      else if (avgWeekly >= 20) { status = '✅ Good'; badge = 'silver'; }
      else if (avgWeekly < 0) { status = '⚠️ Needs Attention'; badge = 'bronze'; }
      
      const achievements = [];
      const milestones = [1500, 1800, 2000, 2200, 2500];
      milestones.forEach(m => {
        if (current >= m && starting < m) {
          achievements.push(`🏆 Crossed ${m}`);
        }
      });
      if (daysSinceStart >= 30) achievements.push('⭐ 30 Days Tracking');
      if (avgWeekly > 0) achievements.push('📈 Consistent Growth');
      
      const recommendations = [];
      if (avgWeekly >= 50) {
        recommendations.push('Excellent progress! Keep solving 10-15 puzzles daily');
        recommendations.push('Challenge yourself with higher-rated puzzles');
      } else if (avgWeekly >= 20) {
        recommendations.push('Good progress! Try to increase puzzle volume');
        recommendations.push('Focus on your weak tactical themes');
      } else if (avgWeekly > 0) {
        recommendations.push('Solve more puzzles regularly (aim for 10+ daily)');
        recommendations.push('Review failed puzzles to learn patterns');
      } else {
        recommendations.push('Time to focus on tactical training!');
        recommendations.push('Start with easier puzzles to build confidence');
      }
      
      return {
        current, starting, peak, totalChange, percentChange,
        weeklyChange, avgWeekly, status, badge,
        daysActive: Math.round(daysSinceStart),
        snapshots: puzzleRatings.length,
        achievements, recommendations
      };
    }

    async function showTrainingPlan(playerId) {
      const players = getPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus('Generating AI training plan...', 'info');

      // Generate or refresh training plan
      if (!player.trainingPlan || shouldRegeneratePlan(player)) {
        await generateAutomaticTrainingPlan(player);
        savePlayers(players);
      }

      displayTrainingPlan(player);
    }

    function shouldRegeneratePlan(player) {
      if (!player.trainingPlan) return true;
      const hoursSinceUpdate = (Date.now() - player.trainingPlan.generated) / (1000 * 60 * 60);
      return hoursSinceUpdate >= 24; // Regenerate daily
    }

    async function generateAutomaticTrainingPlan(player) {
      const analysis = await analyzePlayerPerformance(player);
      const plan = createPersonalizedPlan(player, analysis);
      
      player.trainingPlan = {
        generated: Date.now(),
        analysis: analysis,
        dailyTasks: plan.dailyTasks,
        weeklyGoals: plan.weeklyGoals,
        completedTasks: player.trainingPlan?.completedTasks || [],
        streakDays: calculateStreak(player)
      };
    }

    async function analyzePlayerPerformance(player) {
      const history = player.history;
      if (history.length < 2) {
        // Not enough data for detailed analysis - provide beginner guidance
      const latest = history[history.length - 1];
      return {
        level: 'beginner',
        currentRating: latest.lichess?.rapid || latest.chesscom?.rapid || 1200,
        ratingChange: 0,
        daysTracking: history.length,
        weeklyGain: 0,
        weakAreas: ['general-improvement'],
        recommendations: ['Build consistent practice habit', 'Focus on basic tactics', 'Play regularly to track progress']
      };

      const latest = history[history.length - 1];
      const currentRating = latest.lichess.rapid || latest.chesscom.rapid || 1200;
      const currentPuzzle = latest.lichess.puzzle || latest.chesscom.puzzle || 1200;

      // Calculate progress
      const firstSnapshot = history[0];
      const ratingChange = currentRating - (firstSnapshot.lichess.rapid || firstSnapshot.chesscom.rapid || currentRating);
      const puzzleChange = currentPuzzle - (firstSnapshot.lichess.puzzle || firstSnapshot.chesscom.puzzle || currentPuzzle);

      // Weekly progress
      const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
      const recentHistory = history.filter(h => h.timestamp > oneWeekAgo);
      const weeklyGain = recentHistory.length >= 2 
        ? (recentHistory[recentHistory.length - 1].lichess.rapid || 0) - (recentHistory[0].lichess.rapid || 0)
        : 0;

      // Determine level
      let level = 'beginner';
      if (currentRating >= 1600) level = 'intermediate';
      if (currentRating >= 2000) level = 'advanced';

      // Identify weak areas
      const weakAreas = [];
      if (currentPuzzle < currentRating - 100) weakAreas.push('tactical-vision');
      if (weeklyGain < 0) weakAreas.push('consistency');
      if (currentRating < 1400) weakAreas.push('fundamentals');

      // Fetch enhanced data for Option B
      let gameStats = null;
      let recentGames = null;
      let openingStats = [];
      
      if (player.lichessUsername) {
        gameStats = await fetchLichessGameStats(player.lichessUsername);
        recentGames = await fetchLichessRecentGames(player.lichessUsername, 10);
        
        // Analyze openings from recent games
        if (recentGames && recentGames.length > 0) {
          const openingCounts = {};
          recentGames.forEach(game => {
            if (game.Opening) {
              const opening = game.Opening.split(':')[0].trim();
              openingCounts[opening] = (openingCounts[opening] || 0) + 1;
            }
          });
          openingStats = Object.entries(openingCounts)
            .map(([name, count]) => ({ name, count }))
            .sort((a, b) => b.count - a.count)
            .slice(0, 3);
        }
      },
        gameStats,
        recentGames,
        openingStats,

      return {
        level,
        currentRating,
        currentPuzzle,
        ratingChange,
        puzzleChange,
        weeklyGain,
        weakAreas,
        daysTracking: Math.round((Date.now() - firstSnapshot.timestamp) / (1000 * 60 * 60 * 24))
      };
    }

    function createPersonalizedPlan(player, analysis) {
      const tasks = [];
      const goals = [];

      // Priority 1: Puzzle training based on level
      if (analysis.level === 'beginner') {
        tasks.push({
          id: 'puzzle-1',
          title: 'Solve 10 easy puzzles',
          details: 'Focus on basic tactics (forks, pins, skewers)',
          link: 'https://lichess.org/training',
          priority: 'high',
          completed: false
        });
      } else if (analysis.level === 'intermediate') {
        tasks.push({
          id: 'puzzle-1',
          title: 'Solve 15 medium puzzles',
          details: 'Mix of tactical themes at your rating level',
          link: 'https://lichess.org/training',
          priority: 'high',
          completed: false
        });
      } else {
        tasks.push({
          id: 'puzzle-1',
          title: 'Solve 20 challenging puzzles',
          details: 'Advanced tactics and combinations',
          link: 'https://lichess.org/training',
          priority: 'high',
          completed: false
        });
      }

      // Priority 2: Game practice
      tasks.push({
        id: 'game-1',
        title: `Play ${analysis.level === 'beginner' ? '1' : '2'} rapid game${analysis.level === 'beginner' ? '' : 's'}`,
        details: analysis.weeklyGain < 0 ? 'Focus on avoiding blunders' : 'Apply tactical patterns from puzzles',
        link: player.lichessUsername ? 'https://lichess.org' : 'https://chess.com/play',
        priority: 'high',
        completed: false
      });

      // Priority 3: Weakness-specific training
      if (analysis.weakAreas.includes('tactical-vision')) {
        tasks.push({
          id: 'weakness-1',
          title: 'Tactical vision training',
          details: `Your puzzle rating (${analysis.currentPuzzle}) is below your game rating. Solve 10 extra puzzles today.`,
          link: 'https://lichess.org/training/themes',
          priority: 'medium',
          completed: false
        });
      }

      if (analysis.weeklyGain < 0) {
        tasks.push({
          id: 'analysis-1',
          title: 'Analyze your recent losses',
          details: 'Find the critical mistakes and learn from them',
          link: player.lichessUsername ? `https://lichess.org/@/${player.lichessUsername}` : '#',
          priority: 'high',
          completed: false
        });
      }

      // Weekly Goals
      const ratingGoal = analysis.currentRating + (analysis.level === 'beginner' ? 50 : analysis.level === 'intermediate' ? 30 : 20);
      goals.push(`Reach ${ratingGoal} rating`);
      goals.push(`Solve 100+ puzzles this week`);
      goals.push(`Maintain ${Math.max(analysis.weeklyGain, 10)}+ weekly gain`);

      if (analysis.daysTracking >= 7) {
        goals.push(`Keep your ${analysis.daysTracking}-day tracking streak!`);
      }


      // Add opening repertoire recommendations
      if (analysis.openingStats && analysis.openingStats.length > 0) {
        tasks.push({
          id: 'opening-1',
          title: `Study your most played opening: ${analysis.openingStats[0].name}`,
          details: `You've played this ${analysis.openingStats[0].count} times recently`,
          link: `https://lichess.org/analysis#explorer`,
          priority: 'medium',
          completed: false
        });
      }

      return { dailyTasks: tasks, weeklyGoals: goals };
    }

    function calculateStreak(player) {
      if (!player.history || player.history.length === 0) return 0;
      
      const oneDayMs = 24 * 60 * 60 * 1000;
      const sortedHistory = [...player.history].sort((a, b) => b.timestamp - a.timestamp);
      
      let streak = 0;
      let lastDate = Date.now();
      
      for (const snapshot of sortedHistory) {
        const daysDiff = Math.floor((lastDate - snapshot.timestamp) / oneDayMs);
        if (daysDiff <= 1) {
          streak++;
          lastDate = snapshot.timestamp;
        } else {
          break;
        }
      }
      
      return streak;
    }

    // Achievement tracking system
      function checkAchievements(player, analysis) {
        const achievements = [];
        
        // Rating milestones
        if (analysis.currentRating >= 1500 && analysis.currentRating < 1600) {
          achievements.push({ id: 'milestone-1500', title: '🏆 Reached 1500 Rating!', icon: '🏆' });
        } else if (analysis.currentRating >= 1800 && analysis.currentRating < 1900) {
          achievements.push({ id: 'milestone-1800', title: '⭐ Reached 1800 Rating!', icon: '⭐' });
        } else if (analysis.currentRating >= 2000) {
          achievements.push({ id: 'milestone-2000', title: '🎖️ Reached 2000+ Rating!', icon: '🎖️' });
        }
        
        // Streak achievements
        const streak = calculateStreak(player);
        if (streak >= 7) {
          achievements.push({ id: 'streak-7', title: '🔥 7-Day Streak!', icon: '🔥' });
        }
        if (streak >= 30) {
          achievements.push({ id: 'streak-30', title: '💎 30-Day Streak!', icon: '💎' });
        }
        
        // Weekly gain achievements
        if (analysis.weeklyGain >= 50) {
          achievements.push({ id: 'weekly-50', title: '🚀 +50 Rating This Week!', icon: '🚀' });
        }
        
        // Puzzle rating achievements
        if (analysis.currentPuzzle >= 2000) {
          achievements.push({ id: 'puzzle-2000', title: '🧩 Puzzle Master (2000+)', icon: '🧩' });
        }
        
        return achievements;
      }

      // Save/load task completion state
      function saveTaskCompletion(playerId, taskId) {
        const key = `tasks_${playerId}`;
        const tasks = JSON.parse(localStorage.getItem(key) || '{}');
        tasks[taskId] = { completed: true, timestamp: Date.now() };
        localStorage.setItem(key, JSON.stringify(tasks));
      }

      function loadTaskCompletion(playerId) {
        const key = `tasks_${playerId}`;
        return JSON.parse(localStorage.getItem(key) || '{}');
      }

      function clearOldTasks(playerId) {
        const key = `tasks_${playerId}`;
        const tasks = JSON.parse(localStorage.getItem(key) || '{}');
        const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);
        
        // Remove tasks older than 1 day
        Object.keys(tasks).forEach(taskId => {
          if (tasks[taskId].timestamp < oneDayAgo) {
            delete tasks[taskId];
          }
        });
        
        localStorage.setItem(key, JSON.stringify(tasks));
      }
