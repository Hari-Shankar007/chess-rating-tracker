<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Rating Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    .input-section {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #0f3460;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 150px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #0f3460;
      color: white;
    }
    .btn-primary:hover {
      background: #16213e;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(15,52,96,0.3);
    }
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background: #5a6268;
    }
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    .btn-danger:hover {
      background: #c82333;
    }
    .players-list {
      margin-bottom: 30px;
    }
    .player-card {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }
    .player-card:hover {
      transform: translateX(5px);
      border-color: #0f3460;
    }
    .player-card.active {
      border-color: #0f3460;
      background: #e7f1ff;
    }
    .player-info h3 {
      color: #333;
      margin-bottom: 5px;
    }
    .player-info p {
      color: #666;
      font-size: 14px;
    }
    .player-actions button {
      min-width: auto;
      padding: 8px 15px;
      font-size: 14px;
    }
    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }
    .chart-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .chart-box h3 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
    }
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }
    @media (max-width: 768px) {
      .charts-container {
        grid-template-columns: 1fr;
      }
      .btn-group {
        flex-direction: column;
      }
    }

    /* Report Modal Styles */
    .report-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }
    .report-modal.active {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .report-content {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 1000px;
      width: 100%;
      margin: 20px;
      position: relative;
    }
    .report-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 30px;
      cursor: pointer;
      color: #666;
      background: none;
      border: none;
      padding: 0;
      width: 40px;
      height: 40px;
    }
    .report-close:hover {
      color: #dc3545;
    }

    .report-header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 3px solid #0f3460;
      padding-bottom: 20px;
    }
    .report-header h2 {
      color: #0f3460;
      font-size: 2em;
      margin-bottom: 10px;
    }
    .auto-badge {
      display: inline-block;
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9em;
      margin-top: 10px;
    }

    .analysis-section {
      margin: 30px 0;
    }
    .analysis-section h3 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.4em;
      border-bottom: 2px solid #0f3460;
      padding-bottom: 10px;
    }

    .weakness-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .weakness-card {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #ffc107;
    }
    .weakness-card.critical {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      border-left-color: #dc3545;
    }
    .weakness-card.moderate {
      background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
      border-left-color: #ffc107;
    }
    .weakness-card.weak {
      background: linear-gradient(135deg, #e2e3e5 0%, #d6d8db 100%);
      border-left-color: #6c757d;
    }
    .weakness-card h4 {
      color: #333;
      margin-bottom: 8px;
      font-size: 1.1em;
    }
    .weakness-card .accuracy {
      font-size: 2em;
      font-weight: bold;
      color: #dc3545;
    }
    .weakness-card .label {
      color: #666;
      font-size: 0.9em;
      margin-top: 5px;
    }

    .strength-card {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #28a745;
    }
    .strength-card .accuracy {
      color: #28a745;
    }

    .daily-tasks {
      margin: 30px 0;
    }
    .daily-tasks h3 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.4em;
    }

    .task-item {
      background: #f8f9fa;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      border-left: 4px solid #0f3460;
      transition: all 0.3s;
    }
    .task-item:hover {
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .task-item.completed {
      opacity: 0.6;
      border-left-color: #28a745;
      background: #d4edda;
    }
    .task-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }
    .task-checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
    }
    .task-title {
      font-size: 1.1em;
      font-weight: 600;
      color: #333;
      flex: 1;
    }
    .task-priority {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
    }
    .task-priority.high {
      background: #dc3545;
      color: white;
    }
    .task-priority.medium {
      background: #ffc107;
      color: #333;
    }
    .task-priority.low {
      background: #6c757d;
      color: white;
    }
    .task-details {
      margin-left: 39px;
      color: #666;
      margin-top: 10px;
    }
    .task-reason {
      background: #e7f1ff;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0 10px 39px;
      font-size: 0.9em;
      color: #0f3460;
    }
    .task-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: #0f3460;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9em;
    }
    .task-link:hover {
      background: #16213e;
    }

    .weekly-goals {
      background: #e8e8e8;
      padding: 25px;
      border-radius: 15px;
      margin: 30px 0;
      border: 2px solid #0f3460;
    }
    .weekly-goals h3 {
      color: #333;
      margin-bottom: 20px;
    }
    .goal-item {
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .goal-progress {
      font-weight: bold;
      color: #0f3460;
    }

    .progress-tracker {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }
    .streak-display {
      text-align: center;
      font-size: 2em;
      color: #0f3460;
      margin: 10px 0;
    }

    .opening-stats {
      margin: 20px 0;
    }
    .opening-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 15px;
      align-items: center;
    }
    .opening-name {
      font-weight: 600;
      color: #333;
    }
    .opening-games {
      color: #666;
    }
    .opening-winrate {
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    .opening-winrate.good {
      background: #d4edda;
      color: #155724;
    }
    .opening-winrate.bad {
      background: #f8d7da;
      color: #721c24;
    }
    .opening-winrate.neutral {
      background: #fff3cd;
      color: #856404;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0f3460;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn-report {
      background: #0f3460;
      color: white;
      min-width: auto;
    }
    .btn-update {
      background: #28a745;
      color: white;
      min-width: auto;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .metric-card {
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
      color: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
    }
    .metric-card h4 {
      font-size: 14px;
      margin-bottom: 10px;
      opacity: 0.9;
    }
    .metric-card .big-number {
      font-size: 2.5em;
      font-weight: bold;
      margin: 10px 0;
    }
    .metric-card .change {
      font-size: 1.1em;
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
    }
    .metric-card .change.positive {
      background: rgba(76,175,80,0.3);
    }
    .metric-card .change.negative {
      background: rgba(244,67,54,0.3);
    }

    @media print {
      body * {
        visibility: hidden;
      }
      .report-content, .report-content * {
        visibility: visible;
      }
      .report-content {
        position: absolute;
        left: 0;
        top: 0;
      }
      .report-close {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chess Rating Tracker</h1>
    <p class="subtitle">Track puzzle and rapid ratings with AI-powered training plans</p>

    <div id="statusMessage"></div>

    <div class="input-section">
      <div class="input-group">
        <label for="playerName">Student Name</label>
        <input type="text" id="playerName" placeholder="e.g., Anand - Batch B2">
      </div>
      <div class="input-group">
        <label for="lichessUsername">Lichess Username (required for AI training plans)</label>
        <input type="text" id="lichessUsername" placeholder="e.g., anand_2009">
      </div>
      <div class="input-group">
        <label for="chesscomUsername">Chess.com Username (optional)</label>
        <input type="text" id="chesscomUsername" placeholder="e.g., anand_chess2009">
      </div>
      <div class="btn-group">
        <button class="btn-primary" onclick="addPlayer()">Add Student</button>
        <button class="btn-secondary" onclick="fetchAllRatings()">Update All Ratings</button>
        <button class="btn-danger" onclick="clearAllData()">Clear All Data</button>
      </div>
    </div>

    <div class="players-list" id="playersList"></div>

    <div class="charts-container" id="chartsContainer"></div>
  </div>

  <!-- Report Modal (Weakness-Based Training Plan) -->
  <div class="report-modal" id="reportModal">
    <div class="report-content" id="reportContent">
      <button class="report-close" onclick="closeReport()">&times;</button>
      <div id="reportBody"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = window.location.hostname.includes('localhost')
      ? 'http://localhost:54321/functions/v1/auto-training'
      : `${window.location.origin}/functions/v1/auto-training`;

    const STORAGE_KEY = 'chessdbRatingTracker';
    let selectedPlayerId = null;
    let dbPlayers = {};

    function getLocalPlayers() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function saveLocalPlayers(players) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
    }

    function showStatus(message, type = 'info') {
      const statusEl = document.getElementById('statusMessage');
      statusEl.className = `status ${type}`;
      statusEl.innerHTML = message;
      setTimeout(() => statusEl.textContent = '', 5000);
    }

    async function fetchLichessRatings(username) {
      try {
        const response = await fetch(`https://lichess.org/api/user/${username}`);
        if (!response.ok) throw new Error('Lichess user not found');
        const data = await response.json();
        return {
          rapid: data.perfs?.rapid?.rating || null,
          puzzle: data.perfs?.puzzle?.rating || null
        };
      } catch (error) {
        console.error('Lichess error:', error);
        return { rapid: null, puzzle: null };
      }
    }

    async function fetchChesscomRatings(username) {
      try {
        const response = await fetch(`https://api.chess.com/pub/player/${username}/stats`);
        if (!response.ok) throw new Error('Chess.com user not found');
        const data = await response.json();
        return {
          rapid: data.chess_rapid?.last?.rating || null,
          puzzle: data.tactics?.highest?.rating || null
        };
      } catch (error) {
        console.error('Chess.com error:', error);
        return { rapid: null, puzzle: null };
      }
    }

    async function addPlayer() {
      const name = document.getElementById('playerName').value.trim();
      const lichessUser = document.getElementById('lichessUsername').value.trim();
      const chesscomUser = document.getElementById('chesscomUsername').value.trim();

      if (!name) {
        showStatus('Please enter a student name', 'error');
        return;
      }

      if (!lichessUser && !chesscomUser) {
        showStatus('Please enter at least one username', 'error');
        return;
      }

      showStatus('<span class="loading-spinner"></span>Adding student...', 'info');

      // Add to local storage
      const players = getLocalPlayers();
      const newPlayer = {
        id: Date.now().toString(),
        name,
        lichessUsername: lichessUser || null,
        chesscomUsername: chesscomUser || null,
        history: []
      };

      players.push(newPlayer);
      saveLocalPlayers(players);

      document.getElementById('playerName').value = '';
      document.getElementById('lichessUsername').value = '';
      document.getElementById('chesscomUsername').value = '';

      showStatus(`${name} added successfully!`, 'success');
      displayPlayers();

      // Fetch initial ratings
      await fetchPlayerRating(newPlayer.id);
    }

    async function fetchPlayerRating(playerId) {
      const players = getLocalPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus(`<span class="loading-spinner"></span>Fetching ratings for ${player.name}...`, 'info');

      const snapshot = {
        timestamp: Date.now(),
        lichess: { rapid: null, puzzle: null },
        chesscom: { rapid: null, puzzle: null }
      };

      if (player.lichessUsername) {
        snapshot.lichess = await fetchLichessRatings(player.lichessUsername);
      }

      if (player.chesscomUsername) {
        snapshot.chesscom = await fetchChesscomRatings(player.chesscomUsername);
      }

      player.history.push(snapshot);
      saveLocalPlayers(players);

      showStatus(`Ratings updated for ${player.name}!`, 'success');
      displayPlayers();
      if (selectedPlayerId === playerId) {
        displayCharts(playerId);
      }
    }

    async function fetchAllRatings() {
      const players = getLocalPlayers();
      if (players.length === 0) {
        showStatus('No students added yet', 'error');
        return;
      }

      showStatus('<span class="loading-spinner"></span>Updating all ratings...', 'info');
      for (const player of players) {
        await fetchPlayerRating(player.id);
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      showStatus('All ratings updated!', 'success');
    }

    function deletePlayer(playerId) {
      if (!confirm('Are you sure you want to delete this student?')) return;

      let players = getLocalPlayers();
      players = players.filter(p => p.id !== playerId);
      saveLocalPlayers(players);

      if (selectedPlayerId === playerId) {
        selectedPlayerId = null;
        document.getElementById('chartsContainer').innerHTML = '';
      }

      showStatus('Student deleted', 'success');
      displayPlayers();
    }

    function displayPlayers() {
      const players = getLocalPlayers();
      const container = document.getElementById('playersList');

      if (players.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#666;">No students added yet. Add your first student above!</p>';
        return;
      }

      container.innerHTML = players.map(player => {
        const lastSnapshot = player.history[player.history.length - 1];
        const platforms = [];
        if (player.lichessUsername) platforms.push('Lichess');
        if (player.chesscomUsername) platforms.push('Chess.com');

        return `
          <div class="player-card ${selectedPlayerId === player.id ? 'active' : ''}" onclick="selectPlayer('${player.id}')">
            <div class="player-info">
              <h3>${player.name}</h3>
              <p>${platforms.join(' & ')} | ${player.history.length} snapshots</p>
            </div>
            <div class="player-actions">
              <button class="btn-update" onclick="event.stopPropagation(); fetchPlayerRating('${player.id}')">Update</button>
        <button class="btn-report" onclick="event.stopPropagation(); showWeaknessReport('${player.id}')">AI Training Plan</button>
              <button class="btn-danger" onclick="event.stopPropagation(); deletePlayer('${player.id}')">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectPlayer(playerId) {
      selectedPlayerId = playerId;
      displayPlayers();
      displayCharts(playerId);
    }

    function displayCharts(playerId) {
      const players = getLocalPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player || player.history.length === 0) {
        document.getElementById('chartsContainer').innerHTML = '<p style="text-align:center;color:#666;">No rating history yet. Click "Update" to fetch ratings.</p>';
        return;
      }

      const labels = player.history.map(h => new Date(h.timestamp).toLocaleDateString());

      const lichessRapid = player.history.map(h => h.lichess.rapid);
      const lichessPuzzle = player.history.map(h => h.lichess.puzzle);
      const chesscomRapid = player.history.map(h => h.chesscom.rapid);
      const chesscomPuzzle = player.history.map(h => h.chesscom.puzzle);

      const container = document.getElementById('chartsContainer');
      container.innerHTML = '';

      if (player.lichessUsername) {
        container.innerHTML += `
          <div class="chart-box">
            <h3>Lichess - Rapid Rating</h3>
            <canvas id="lichessRapidChart"></canvas>
          </div>
          <div class="chart-box">
            <h3>Lichess - Puzzle Rating</h3>
            <canvas id="lichessPuzzleChart"></canvas>
          </div>
        `;
      }

      if (player.chesscomUsername) {
        container.innerHTML += `
          <div class="chart-box">
            <h3>Chess.com - Rapid Rating</h3>
            <canvas id="chesscomRapidChart"></canvas>
          </div>
          <div class="chart-box">
            <h3>Chess.com - Tactics Rating</h3>
            <canvas id="chesscomPuzzleChart"></canvas>
          </div>
        `;
      }

      setTimeout(() => {
        if (player.lichessUsername) {
          createChart('lichessRapidChart', labels, lichessRapid, 'Lichess Rapid', '#0f3460');
          createChart('lichessPuzzleChart', labels, lichessPuzzle, 'Lichess Puzzle', '#dc3545');
        }
        if (player.chesscomUsername) {
          createChart('chesscomRapidChart', labels, chesscomRapid, 'Chess.com Rapid', '#28a745');
          createChart('chesscomPuzzleChart', labels, chesscomPuzzle, 'Chess.com Tactics', '#ffc107');
        }
      }, 100);
    }

    function createChart(canvasId, labels, data, label, color) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: data,
            borderColor: color,
            backgroundColor: color + '33',
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: true, position: 'top' }
          },
          scales: {
            y: { beginAtZero: false, ticks: { stepSize: 50 } }
          }
        }
      });
    }

    function clearAllData() {
      if (!confirm('Delete ALL student data? This cannot be undone!')) return;
      localStorage.removeItem(STORAGE_KEY);
      selectedPlayerId = null;
      displayPlayers();
      document.getElementById('chartsContainer').innerHTML = '';
      showStatus('All data cleared', 'success');
    }

    // ==========================================
    // WEAKNESS-BASED TRAINING PLAN SYSTEM
    // ==========================================

    const THEME_DISPLAY_NAMES = {
      "pin": "Pins",
      "fork": "Forks",
      "skewer": "Skewers",
      "discoveredAttack": "Discovered Attacks",
      "doubleAttack": "Double Attacks",
      "backRankMate": "Back Rank Mates",
      "mateIn1": "Mate in 1",
      "mateIn2": "Mate in 2",
      "mateIn3": "Mate in 3+",
      "queenRookEndgame": "Queen + Rook Endgames",
      "rookEndgame": "Rook Endgames",
      "pawnEndgame": "Pawn Endgames",
      "knightEndgame": "Knight Endgames",
      "bishopEndgame": "Bishop Endgames",
      "attraction": "Attraction",
      "deflection": "Deflection",
      "clearance": "Clearance",
      "interference": "Interference",
      "lineOpening": "Line Opening",
      "trappedPiece": "Trapped Pieces",
      "exchange": "Exchanges",
      "capturingDefender": "Capturing the Defender",
      "removingTheDefender": "Removing the Defender",
      "zugzwang": "Zugzwang",
      "promotion": "Pawn Promotion"
    };

    const THEME_LINKS = {
      "pin": "https://lichess.org/training/themes/pin",
      "fork": "https://lichess.org/training/themes/fork",
      "skewer": "https://lichess.org/training/themes/skewer",
      "discoveredAttack": "https://lichess.org/training/themes/discoveredAttack",
      "backRankMate": "https://lichess.org/training/themes/backRankMate",
      "mateIn1": "https://lichess.org/training/themes/mateIn1",
      "mateIn2": "https://lichess.org/training/themes/mateIn2",
      "rookEndgame": "https://lichess.org/practice/rook-endgames",
      "pawnEndgame": "https://lichess.org/practice/pawn-endgames",
    };

    async function fetchLichessPuzzleActivity(username) {
      try {
        const response = await fetch(`https://lichess.org/api/puzzle/activity?max=100`);
        if (!response.ok) return [];
        const text = await response.text();
        return text.split('\n')
          .filter(line => line.trim())
          .map(line => JSON.parse(line));
      } catch (error) {
        console.error('Puzzle activity error:', error);
        return [];
      }
    }

    async function fetchLichessGames(username, max = 30) {
      try {
        const response = await fetch(
          `https://lichess.org/api/games/user/${username}?max=${max}&tags=true&clocks=false&evals=false&opening=true`
        );
        if (!response.ok) return [];
        const text = await response.text();
        return text.split('\n\n').filter(g => g.trim()).map(game => {
          const lines = game.split('\n');
          const result = {};
          lines.forEach(line => {
            if (line.startsWith('[')) {
              const match = line.match(/\[([^\s]+)\s+"([^"]+)"\]/);
              if (match) result[match[1]] = match[2];
            }
          });
          return result;
        });
      } catch (error) {
        console.error('Games fetch error:', error);
        return [];
      }
    }

    function analyzePuzzleThemes(puzzleActivity) {
      const themeStats = {};

      for (const activity of puzzleActivity) {
        if (!activity.puzzle || !activity.puzzle.themes) continue;
        const themes = activity.puzzle.themes;
        const correct = activity.win === true;

        for (const theme of themes) {
          if (!themeStats[theme]) {
            themeStats[theme] = { total: 0, correct: 0 };
          }
          themeStats[theme].total++;
          if (correct) themeStats[theme].correct++;
        }
      }

      for (const theme of Object.keys(themeStats)) {
        const stats = themeStats[theme];
        themeStats[theme].accuracy = stats.total > 0 ? (stats.correct / stats.total) * 100 : 0;
      }

      return themeStats;
    }

    function analyzeOpenings(games) {
      const openingStats = {};

      for (const game of games) {
        if (!game.Opening) continue;
        const opening = game.Opening.split(':')[0].trim();
        if (!openingStats[opening]) {
          openingStats[opening] = { played: 0, won: 0, drawn: 0, lost: 0 };
        }
        openingStats[opening].played++;
        if (game.Result === '1-0') openingStats[opening].won++;
        else if (game.Result === '0-1') openingStats[opening].lost++;
        else if (game.Result === '1/2-1/2') openingStats[opening].drawn++;
      }

      return Object.entries(openingStats)
        .map(([name, stats]) => ({
          name,
          games_played: stats.played,
          games_won: stats.won,
          games_drawn: stats.drawn,
          games_lost: stats.lost,
          win_rate: stats.played > 0 ? ((stats.won + stats.drawn * 0.5) / stats.played * 100) : 0
        }))
        .sort((a, b) => b.games_played - a.games_played);
    }

    function identifyWeaknesses(themeStats) {
      const weaknesses = [];

      for (const [theme, stats] of Object.entries(themeStats)) {
        if (stats.total >= 3 && stats.accuracy < 75) {
          let strength = 'weak';
          if (stats.accuracy < 50) strength = 'critical';
          else if (stats.accuracy < 65) strength = 'moderate';

          weaknesses.push({
            theme,
            accuracy: stats.accuracy,
            total: stats.total,
            correct: stats.correct,
            strength
          });
        }
      }

      return weaknesses.sort((a, b) => a.accuracy - b.accuracy);
    }

    function identifyStrengths(themeStats) {
      const strengths = [];

      for (const [theme, stats] of Object.entries(themeStats)) {
        if (stats.total >= 3 && stats.accuracy >= 80) {
          strengths.push({
            theme,
            accuracy: stats.accuracy,
            total: stats.total
          });
        }
      }

      return strengths.sort((a, b) => b.accuracy - a.accuracy);
    }

    function generateTrainingTasks(weaknesses, openingStats, playerRating) {
      const tasks = [];

      // Priority 1: Critical weaknesses
      for (let i = 0; i < Math.min(3, weaknesses.length); i++) {
        const weakness = weaknesses[i];
        const themeCount = weakness.accuracy < 50 ? 25 : weakness.accuracy < 65 ? 20 : 15;

        tasks.push({
          id: `puzzle-${i}`,
          task_type: 'puzzle',
          task_title: `Solve ${themeCount} "${THEME_DISPLAY_NAMES[weakness.theme] || weakness.theme}" puzzles`,
          task_details: `Target: 80% accuracy | Difficulty: ${playerRating - 100}-${playerRating + 100}`,
          weakness_reason: `Current: ${weakness.accuracy.toFixed(0)}% accuracy (${weakness.correct}/${weakness.total} correct) - ${weakness.strength.toUpperCase()} AREA`,
          link: THEME_LINKS[weakness.theme] || `https://lichess.org/training/themes/${weakness.theme}`,
          priority: weakness.strength === 'critical' || weakness.strength === 'moderate' ? 'high' : 'medium',
          completed: false
        });
      }

      // Priority 2: Opening recommendations
      if (openingStats.length > 1) {
        const sortByWinRate = [...openingStats].sort((a, b) => b.win_rate - a.win_rate);
        const worstOpening = sortByWinRate[sortByWinRate.length - 1];
        const bestOpening = sortByWinRate[0];

        if (worstOpening && worstOpening.win_rate < 40 && worstOpening.games_played >= 3) {
          tasks.push({
            id: 'opening-weak',
            task_type: 'opening',
            task_title: `Review or replace: ${worstOpening.name}`,
            task_details: `Consider studying alternatives to this opening`,
            weakness_reason: `Only ${worstOpening.win_rate.toFixed(0)}% win rate (${worstOpening.games_played} games played)`,
            link: 'https://lichess.org/analysis#explorer',
            priority: 'medium',
            completed: false
          });
        }

        if (bestOpening && bestOpening.win_rate > 50 && bestOpening.games_played >= 2) {
          tasks.push({
            id: 'opening-strong',
            task_type: 'opening',
            task_title: `Continue mastering: ${bestOpening.name}`,
            task_details: 'Your most successful opening - keep using it!',
            weakness_reason: `${bestOpening.win_rate.toFixed(0)}% win rate - stick with what works!`,
            link: 'https://lichess.org/analysis#explorer',
            priority: 'low',
            completed: false
          });
        }
      }

      // Priority 3: Game practice
      const gameCount = playerRating < 1500 ? 1 : 2;
      tasks.push({
        id: 'game-practice',
        task_type: 'game',
        task_title: `Play ${gameCount} rapid game${gameCount > 1 ? 's' : ''} (15+10)`,
        task_details: 'Apply the tactical patterns you practiced in real games',
        weakness_reason: 'Practice makes perfect - apply your training!',
        link: 'https://lichess.org',
        priority: 'high',
        completed: false
      });

      return tasks;
    }

    function generateWeeklyGoals(weaknesses, playerRating) {
      const goals = [];

      if (weaknesses.length > 0) {
        const topWeakness = weaknesses[0];
        goals.push({
          goal_type: 'weakness_improvement',
          goal_text: `Improve ${THEME_DISPLAY_NAMES[topWeakness.theme] || topWeakness.theme} accuracy to 80%`,
          target: 80,
          current: Math.round(topWeakness.accuracy)
        });
      }

      const ratingTarget = playerRating + (playerRating < 1500 ? 50 : playerRating < 1800 ? 30 : 20);
      goals.push({
        goal_type: 'rating_gain',
        goal_text: `Reach ${ratingTarget} rating`,
        target: ratingTarget,
        current: playerRating
      });

      goals.push({
        goal_type: 'puzzle_volume',
        goal_text: 'Complete 100+ tactical puzzles',
        target: 100,
        current: 0
      });

      goals.push({
        goal_type: 'streak',
        goal_text: 'Maintain 7-day practice streak',
        target: 7,
        current: 0
      });

      return goals;
    }

    async function showWeaknessReport(playerId) {
      const players = getLocalPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      if (!player.lichessUsername) {
        showStatus('Lichess username required for AI Training Plan', 'error');
        return;
      }

      showStatus('<span class="loading-spinner"></span>Analyzing your chess performance...', 'info');

      // Fetch data from Lichess
      const [puzzleActivity, games, userStats] = await Promise.all([
        fetchLichessPuzzleActivity(player.lichessUsername),
        fetchLichessGames(player.lichessUsername, 30),
        fetch(`https://lichess.org/api/user/${player.lichessUsername}`).then(r => r.ok ? r.json() : null)
      ]);

      // Analyze data
      const themeStats = analyzePuzzleThemes(puzzleActivity);
      const weaknesses = identifyWeaknesses(themeStats);
      const strengths = identifyStrengths(themeStats);
      const openingStats = analyzeOpenings(games);
      const playerRating = userStats?.perfs?.rapid?.rating ||
                           player.history[player.history.length - 1]?.lichess?.rapid ||
                           1500;

      // Generate training plan
      const dailyTasks = generateTrainingTasks(weaknesses, openingStats, playerRating);
      const weeklyGoals = generateWeeklyGoals(weaknesses, playerRating);

      // Display the report
      displayWeaknessReport(player, weaknesses, strengths, openingStats, dailyTasks, weeklyGoals, playerRating);

      showStatus('AI Training Plan generated!', 'success');
    }

    function displayWeaknessReport(player, weaknesses, strengths, openingStats, dailyTasks, weeklyGoals, playerRating) {
      const html = `
        <div class="report-header">
          <h2>AI Training Plan</h2>
          <h3>${player.name}</h3>
          <span class="auto-badge">Auto-generated daily | Rating: ${playerRating}</span>
        </div>

        ${weaknesses.length > 0 ? `
          <div class="analysis-section">
            <h3>DETECTED WEAKNESSES</h3>
            <div class="weakness-grid">
              ${weaknesses.slice(0, 4).map(w => `
                <div class="weakness-card ${w.strength}">
                  <h4>${THEME_DISPLAY_NAMES[w.theme] || w.theme}</h4>
                  <div class="accuracy">${w.accuracy.toFixed(0)}%</div>
                  <div class="label">${w.correct}/${w.total} correct | ${w.strength.toUpperCase()}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : `
          <div class="analysis-section">
            <h3>NO WEAKNESSES FOUND</h3>
            <p style="color: #666;">Complete more themed puzzles on Lichess for detailed analysis!</p>
          </div>
        `}

        ${strengths.length > 0 ? `
          <div class="analysis-section">
            <h3>YOUR STRENGTHS</h3>
            <div class="weakness-grid">
              ${strengths.slice(0, 3).map(s => `
                <div class="strength-card">
                  <h4>${THEME_DISPLAY_NAMES[s.theme] || s.theme}</h4>
                  <div class="accuracy">${s.accuracy.toFixed(0)}%</div>
                  <div class="label">${s.total} puzzles solved</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${openingStats.length > 0 ? `
          <div class="analysis-section">
            <h3>OPENING PERFORMANCE</h3>
            <div class="opening-stats">
              ${openingStats.slice(0, 5).map(o => `
                <div class="opening-item">
                  <div class="opening-name">${o.name}</div>
                  <div class="opening-games">${o.games_played} games</div>
                  <div class="opening-winrate ${o.win_rate >= 50 ? 'good' : o.win_rate >= 40 ? 'neutral' : 'bad'}">
                    ${o.win_rate.toFixed(0)}% win
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div class="analysis-section">
          <h3>TODAY'S TRAINING TASKS</h3>
          <div class="daily-tasks">
            ${dailyTasks.map((task, idx) => `
              <div class="task-item ${task.completed ? 'completed' : ''}" id="task-${idx}">
                <div class="task-header">
                  <input type="checkbox" class="task-checkbox"
                         ${task.completed ? 'checked' : ''}
                         onchange="toggleTask('${player.id}', ${idx})">
                  <div class="task-title">${task.task_title}</div>
                  <span class="task-priority ${task.priority}">${task.priority.toUpperCase()}</span>
                </div>
                <div class="task-details">${task.task_details}</div>
                <div class="task-reason">${task.weakness_reason}</div>
                ${task.link ? `<a href="${task.link}" target="_blank" class="task-link">Start Training</a>` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        <div class="analysis-section">
          <h3>WEEKLY GOALS</h3>
          <div class="weekly-goals">
            ${weeklyGoals.map(goal => `
              <div class="goal-item">
                <span>${goal.goal_text}</span>
                <span class="goal-progress">${goal.current} / ${goal.target}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div style="background: #f8f9fa; padding: 20px; border-radius: 12px; text-align: center;">
          <p style="color: #666; margin-bottom: 10px;">
            <strong>Auto-Update Schedule:</strong> This plan refreshes every 24 hours based on your latest games and puzzles.
          </p>
          <p style="color: #999; font-size: 0.9em;">Last updated: ${new Date().toLocaleString()}</p>
        </div>
      `;

      document.getElementById('reportBody').innerHTML = html;
      document.getElementById('reportModal').classList.add('active');
    }

    function toggleTask(playerId, taskIdx) {
      const taskEl = document.getElementById(`task-${taskIdx}`);
      if (taskEl) {
        taskEl.classList.toggle('completed');
      }
    }

    function closeReport() {
      document.getElementById('reportModal').classList.remove('active');
    }

    document.getElementById('reportModal').addEventListener('click', function(e) {
      if (e.target === this) closeReport();
    });

    // Auto-update system
    function shouldAutoUpdate(player) {
      const lastUpdate = player.history[player.history.length - 1];
      if (!lastUpdate) return true;
      const hoursSinceUpdate = (Date.now() - lastUpdate.timestamp) / (1000 * 60 * 60);
      return hoursSinceUpdate >= 24;
    }

    async function autoUpdateRatings() {
      const players = getLocalPlayers();
      if (players.length === 0) return;

      for (const player of players) {
        if (shouldAutoUpdate(player)) {
          await fetchPlayerRating(player.id);
        }
      }
    }

    // Initialize
    displayPlayers();
    autoUpdateRatings();

    // Check every hour
    setInterval(autoUpdateRatings, 3600000);
  </script>
