<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Rating Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #667eea;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }
    .input-section {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 150px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102,126,234,0.3);
    }
    .btn-secondary {
      background: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background: #5a6268;
    }
    .btn-danger {
      background: #dc3545;
      color: white;
    }
    .btn-danger:hover {
      background: #c82333;
    }
    .players-list {
      margin-bottom: 30px;
    }
    .player-card {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }
    .player-card:hover {
      transform: translateX(5px);
      border-color: #667eea;
    }
    .player-card.active {
      border-color: #667eea;
      background: #e7f1ff;
    }
    .player-info h3 {
      color: #333;
      margin-bottom: 5px;
    }
    .player-info p {
      color: #666;
      font-size: 14px;
    }
    .player-actions button {
      min-width: auto;
      padding: 8px 15px;
      font-size: 14px;
    }
    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }
    .chart-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .chart-box h3 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
    }
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }
    @media (max-width: 768px) {
      .charts-container {
        grid-template-columns: 1fr;
      }
      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>♟️ Chess Rating Tracker</h1>
    <p class="subtitle">Track puzzle and rapid ratings from Lichess & Chess.com</p>
    
    <div id="statusMessage"></div>
    
    <div class="input-section">
      <div class="input-group">
        <label for="playerName">Student Name</label>
        <input type="text" id="playerName" placeholder="e.g., Anand - Batch B2">
      </div>
      <div class="input-group">
        <label for="lichessUsername">Lichess Username (optional)</label>
        <input type="text" id="lichessUsername" placeholder="e.g., anand_2009">
      </div>
      <div class="input-group">
        <label for="chesscomUsername">Chess.com Username (optional)</label>
        <input type="text" id="chesscomUsername" placeholder="e.g., anand_chess2009">
      </div>
      <div class="btn-group">
        <button class="btn-primary" onclick="addPlayer()">➕ Add Student</button>
        <button class="btn-secondary" onclick="fetchAllRatings()">🔄 Update All Ratings</button>
        <button class="btn-danger" onclick="clearAllData()">🗑️ Clear All Data</button>
      </div>
    </div>
    
    <div class="players-list" id="playersList"></div>
    
    <div class="charts-container" id="chartsContainer"></div>
  </div>

  <script>
    const STORAGE_KEY = 'chessRatingTracker';
    let selectedPlayerId = null;

    function getPlayers() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function savePlayers(players) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
    }

    function showStatus(message, type = 'info') {
      const statusEl = document.getElementById('statusMessage');
      statusEl.className = `status ${type}`;
      statusEl.textContent = message;
      setTimeout(() => statusEl.textContent = '', 5000);
    }

    async function fetchLichessRatings(username) {
      try {
        const response = await fetch(`https://lichess.org/api/user/${username}`);
        if (!response.ok) throw new Error('Lichess user not found');
        const data = await response.json();
        return {
          rapid: data.perfs?.rapid?.rating || null,
          puzzle: data.perfs?.puzzle?.rating || null
        };
      } catch (error) {
        console.error('Lichess error:', error);
        return { rapid: null, puzzle: null };
      }
    }

    async function fetchChesscomRatings(username) {
      try {
        const response = await fetch(`https://api.chess.com/pub/player/${username}/stats`);
        if (!response.ok) throw new Error('Chess.com user not found');
        const data = await response.json();
        return {
          rapid: data.chess_rapid?.last?.rating || null,
          puzzle: data.tactics?.highest?.rating || null
        };
      } catch (error) {
        console.error('Chess.com error:', error);
        return { rapid: null, puzzle: null };
      }
    }

    async function addPlayer() {
      const name = document.getElementById('playerName').value.trim();
      const lichessUser = document.getElementById('lichessUsername').value.trim();
      const chesscomUser = document.getElementById('chesscomUsername').value.trim();

      if (!name) {
        showStatus('Please enter a student name', 'error');
        return;
      }

      if (!lichessUser && !chesscomUser) {
        showStatus('Please enter at least one username (Lichess or Chess.com)', 'error');
        return;
      }

      const players = getPlayers();
      const newPlayer = {
        id: Date.now(),
        name,
        lichessUsername: lichessUser || null,
        chesscomUsername: chesscomUser || null,
        history: []
      };

      players.push(newPlayer);
      savePlayers(players);

      document.getElementById('playerName').value = '';
      document.getElementById('lichessUsername').value = '';
      document.getElementById('chesscomUsername').value = '';

      showStatus(`${name} added successfully!`, 'success');
      displayPlayers();
      await fetchPlayerRating(newPlayer.id);
    }

    async function fetchPlayerRating(playerId) {
      const players = getPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player) return;

      showStatus(`Fetching ratings for ${player.name}...`, 'info');

      const snapshot = {
        timestamp: Date.now(),
        lichess: { rapid: null, puzzle: null },
        chesscom: { rapid: null, puzzle: null }
      };

      if (player.lichessUsername) {
        snapshot.lichess = await fetchLichessRatings(player.lichessUsername);
      }

      if (player.chesscomUsername) {
        snapshot.chesscom = await fetchChesscomRatings(player.chesscomUsername);
      }

      player.history.push(snapshot);
      savePlayers(players);

      showStatus(`Ratings updated for ${player.name}!`, 'success');
      displayPlayers();
      if (selectedPlayerId === playerId) {
        displayCharts(playerId);
      }
    }

    async function fetchAllRatings() {
      const players = getPlayers();
      if (players.length === 0) {
        showStatus('No students added yet', 'error');
        return;
      }

      showStatus('Updating all ratings...', 'info');
      for (const player of players) {
        await fetchPlayerRating(player.id);
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      showStatus('All ratings updated!', 'success');
    }

    function deletePlayer(playerId) {
      if (!confirm('Are you sure you want to delete this student?')) return;
      
      let players = getPlayers();
      players = players.filter(p => p.id !== playerId);
      savePlayers(players);
      
      if (selectedPlayerId === playerId) {
        selectedPlayerId = null;
        document.getElementById('chartsContainer').innerHTML = '';
      }
      
      showStatus('Student deleted', 'success');
      displayPlayers();
    }

    function displayPlayers() {
      const players = getPlayers();
      const container = document.getElementById('playersList');
      
      if (players.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:#666;">No students added yet. Add your first student above!</p>';
        return;
      }

      container.innerHTML = players.map(player => {
        const lastSnapshot = player.history[player.history.length - 1];
        const platforms = [];
        if (player.lichessUsername) platforms.push('Lichess');
        if (player.chesscomUsername) platforms.push('Chess.com');
        
        return `
          <div class="player-card ${selectedPlayerId === player.id ? 'active' : ''}" onclick="selectPlayer(${player.id})">
            <div class="player-info">
              <h3>${player.name}</h3>
              <p>${platforms.join(' & ')} | ${player.history.length} snapshots</p>
            </div>
            <div class="player-actions">
              <button class="btn-primary" onclick="event.stopPropagation(); fetchPlayerRating(${player.id})">Update</button>
              <button class="btn-danger" onclick="event.stopPropagation(); deletePlayer(${player.id})">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectPlayer(playerId) {
      selectedPlayerId = playerId;
      displayPlayers();
      displayCharts(playerId);
    }

    function displayCharts(playerId) {
      const players = getPlayers();
      const player = players.find(p => p.id === playerId);
      if (!player || player.history.length === 0) {
        document.getElementById('chartsContainer').innerHTML = '<p style="text-align:center;color:#666;">No rating history yet. Click "Update" to fetch ratings.</p>';
        return;
      }

      const labels = player.history.map(h => new Date(h.timestamp).toLocaleDateString());
      
      const lichessRapid = player.history.map(h => h.lichess.rapid);
      const lichessPuzzle = player.history.map(h => h.lichess.puzzle);
      const chesscomRapid = player.history.map(h => h.chesscom.rapid);
      const chesscomPuzzle = player.history.map(h => h.chesscom.puzzle);

      const container = document.getElementById('chartsContainer');
      container.innerHTML = '';

      if (player.lichessUsername) {
        container.innerHTML += `
          <div class="chart-box">
            <h3>Lichess - Rapid Rating</h3>
            <canvas id="lichessRapidChart"></canvas>
          </div>
          <div class="chart-box">
            <h3>Lichess - Puzzle Rating</h3>
            <canvas id="lichessPuzzleChart"></canvas>
          </div>
        `;
      }

      if (player.chesscomUsername) {
        container.innerHTML += `
          <div class="chart-box">
            <h3>Chess.com - Rapid Rating</h3>
            <canvas id="chesscomRapidChart"></canvas>
          </div>
          <div class="chart-box">
            <h3>Chess.com - Tactics Rating</h3>
            <canvas id="chesscomPuzzleChart"></canvas>
          </div>
        `;
      }

      setTimeout(() => {
        if (player.lichessUsername) {
          createChart('lichessRapidChart', labels, lichessRapid, 'Lichess Rapid', '#8e44ad');
          createChart('lichessPuzzleChart', labels, lichessPuzzle, 'Lichess Puzzle', '#e74c3c');
        }
        if (player.chesscomUsername) {
          createChart('chesscomRapidChart', labels, chesscomRapid, 'Chess.com Rapid', '#27ae60');
          createChart('chesscomPuzzleChart', labels, chesscomPuzzle, 'Chess.com Tactics', '#f39c12');
        }
      }, 100);
    }

    function createChart(canvasId, labels, data, label, color) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: data,
            borderColor: color,
            backgroundColor: color + '33',
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointRadius: 5,
            pointHoverRadius: 7
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              display: true,
              position: 'top'
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              ticks: {
                stepSize: 50
              }
            }
          }
        }
      });
    }

    function clearAllData() {
      if (!confirm('Are you sure you want to delete ALL student data? This cannot be undone!')) return;
      localStorage.removeItem(STORAGE_KEY);
      selectedPlayerId = null;
      displayPlayers();
      document.getElementById('chartsContainer').innerHTML = '';
      showStatus('All data cleared', 'success');
    }

    displayPlayers();
  </script>
</body>
</html>
